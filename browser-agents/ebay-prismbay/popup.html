<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrismBay eBay Agent</title>
<style>
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;width:330px;margin:0;padding:16px;color:#173a2f;background:#f7faf8}h1{font-size:18px;margin:0 0 10px}.status{padding:10px;border-radius:10px;background:#fff;border:1px solid #d7e2dc;margin:10px 0}.ok{color:#17643f}.bad{color:#9a3412}button{width:100%;margin:5px 0;padding:11px;border:0;border-radius:10px;font-weight:700;cursor:pointer}button.primary{background:#174b38;color:#fff}button.secondary{background:#e8f0ec;color:#173a2f}button[disabled]{opacity:.5;cursor:not-allowed}.small{font-size:11px;color:#667d74;margin-top:8px}
</style>
</head>
<body>
<h1>PrismBay eBay Agent</h1>
<div id="state" class="status">Loading verified marketplace state…</div>
<button id="open" class="secondary">Open eBay listing</button>
<button id="fill" class="primary">Fill verified draft</button>
<button id="publish" class="primary">Publish verified draft</button>
<div class="small">Payment stays inside eBay. The agent blocks publish when CJ/eBay authorization, live stock or dispatch-location verification is missing.</div>
<script src="popup.js"></script>
</body>
</html>
