<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrismBay Video Studio | 30-second production demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>html,body{margin:0;background:#071322;color:#eef6fa}</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-start="0" data-duration="30">
<div id="scene1" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
<div id="scene2" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
<div id="scene3" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="10" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
<div id="scene4" data-composition-id="scene4" data-composition-src="compositions/scene4.html" data-start="15" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
<div id="scene5" data-composition-id="scene5" data-composition-src="compositions/scene5.html" data-start="20" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
<div id="scene6" data-composition-id="scene6" data-composition-src="compositions/scene6.html" data-start="25" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1280" data-height="720"></div>
</div>
<script>window.__timelines=window.__timelines||{};window.__timelines["main"]=gsap.timeline({paused:true});</script>
</body>
</html>
