name: PrismBay accepted-output Short review only
on:
  push:
    paths:
      - youtube-growth/production/render_accepted_output_short.py
      - .github/workflows/prismbay-accepted-output-short-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  short-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow piper-tts
      - name: Render original voiceover and 1080x1920 video
        run: |
          python youtube-growth/production/render_accepted_output_short.py --voice piper --output-dir out/youtube/accepted-output-short
      - name: Verify channel, claims, media and unpublished state
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('out/youtube/accepted-output-short')
          m=json.loads((p/'manifest.json').read_text())
          assert m['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert m['brandId']=='6945443'
          assert m['publicationApproved'] is False and m['uploadPermitted'] is False
          assert m['paidSpendUSD']==0 and m['fictionalExample'] is True
          assert m['narrationSegments']==12 and m['sceneCount']==6
          rights=m['voiceRightsReview']
          assert m['voice']=='en_US-norman-medium'
          assert rights['status']=='SOURCE_REVIEWED_NOT_LEGAL_OPINION'
          assert rights['voiceModel']==m['voice']
          assert rights['dataset']=='LibriVox public-domain recordings'
          assert rights['upstreamModelCard'].endswith('/en/en_US/norman/medium/MODEL_CARD')
          assert rights['limitation'] and 'Editorial approval' in m['outstanding']
          assert 'Independent full listening' in m['outstanding']
          assert 'Real-device YouTube UI playback' in m['outstanding']
          assert 25<m['durationSeconds']<100
          s=(p/'captions-phrase-synchronous.srt').read_text()
          assert s.count(' --> ')==12
          def sec(t):
            h,mi,rest=t.split(':'); ss,ms=rest.split(',')
            return int(h)*3600+int(mi)*60+int(ss)+int(ms)/1000
          for block in s.strip().split('\n\n'):
            lines=block.splitlines()
            start,end=lines[1].split(' --> ')
            words=len(' '.join(lines[2:]).split())
            assert 60*words/(sec(end)-sec(start)) <= 160.1, (lines[0],words)
          v=p/'prismbay-ai-accepted-output-cost-short-review.mp4'
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-xerror','-i',str(v),'-f','null','-'],check=True)
          print('Short draft media and guardrails verified. No publication.')
          PY
      - name: Build audio and mobile-layout editorial review pack
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('out/youtube/accepted-output-short')
          review=root/'release-review-pack';review.mkdir(exist_ok=True)
          video=root/'prismbay-ai-accepted-output-cost-short-review.mp4'
          m=json.loads((root/'manifest.json').read_text())
          assert m['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert m['publicationApproved'] is False and m['uploadPermitted'] is False
          def command(args):
            return subprocess.run(args,capture_output=True,text=True,check=True)
          vol=command(['ffmpeg','-hide_banner','-nostats','-i',str(video),'-vn','-af','volumedetect','-f','null','-']).stderr
          peak=re.search(r'max_volume:\s*([-\d.]+) dB',vol)
          mean=re.search(r'mean_volume:\s*([-\d.]+) dB',vol)
          assert peak and mean,'Audio measurement missing'
          peak_db=float(peak.group(1));mean_db=float(mean.group(1))
          assert peak_db<=-0.1, f'Peak too high: {peak_db} dBFS'
          assert mean_db>-45, f'Audio unexpectedly quiet: {mean_db} dBFS'
          silence=command(['ffmpeg','-hide_banner','-nostats','-i',str(video),'-vn','-af','silencedetect=noise=-45dB:d=1.25','-f','null','-']).stderr
          assert 'silence_start:' not in silence,'Unexpected silence longer than 1.25 seconds'
          def sec(s):
            h,minute,rest=s.split(':');second,ms=rest.split(',')
            return int(h)*3600+int(minute)*60+int(second)+int(ms)/1000
          cues=[]
          for block in (root/'captions-phrase-synchronous.srt').read_text().strip().split('\n\n'):
            lines=block.splitlines();start,end=lines[1].split(' --> ')
            cues.append((sec(start),sec(end),' '.join(lines[2:])))
          spec=importlib.util.spec_from_file_location('short_source','youtube-growth/production/render_accepted_output_short.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          assert [c[2] for c in cues]==[p[1] for p in module.PHRASES]
          assert len(cues)==12
          sheets=[]
          hashes=[]
          for i,(start,end,spoken) in enumerate(cues):
            t=(start+end)/2
            out=review/f'frame-{i+1:02d}.png'
            command(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{t:.3f}','-i',str(video),'-frames:v','1','-vf','scale=324:576:flags=lanczos',str(out)])
            hashes.append(hashlib.sha256(out.read_bytes()).hexdigest())
            sheets.append((Image.open(out).convert('RGB'),t))
          assert len(set(hashes))==12,'Duplicate sampled caption frames'
          for masked,name in [(False,'all-12-caption-frames.png'),(True,'simulated-mobile-ui-safety.png')]:
            sheet=Image.new('RGB',(1386,1926),'#eaf0f4')
            draw=ImageDraw.Draw(sheet)
            for i,(img,t) in enumerate(sheets):
              x=18+(i%4)*342;y=18+(i//4)*636
              draw.text((x,y),f'CAPTION {i+1:02d}   {t:.2f}s',fill='#132c3c')
              if masked:
                overlay=Image.new('RGBA',img.size,(0,0,0,0));o=ImageDraw.Draw(overlay)
                o.rectangle((0,0,324,43),fill=(220,50,50,85))
                o.rectangle((0,480,324,576),fill=(220,50,50,85))
                o.rectangle((275,245,324,480),fill=(220,50,50,85))
                img=Image.alpha_composite(img.convert('RGBA'),overlay).convert('RGB')
              sheet.paste(img,(x,y+35))
            sheet.save(review/name,optimize=True)
          report={'channelId':m['channelId'],'brandId':m['brandId'],'captionCount':len(cues),
                  'narrationTextMatches':True,'uniqueCaptionFrames':len(set(hashes)),
                  'audioMeanDb':mean_db,'audioPeakDb':peak_db,'extendedSilenceDetected':False,
                  'uiSafety':'simulated_only_not_physical_device_validation',
                  'publicationApproved':False,'outstanding':m['outstanding']}
          (review/'review-results.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Store unpublished review artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-accepted-output-short-unpublished
          path: |
            out/youtube/accepted-output-short/prismbay-ai-accepted-output-cost-short-review.mp4
            out/youtube/accepted-output-short/captions-phrase-synchronous.srt
            out/youtube/accepted-output-short/manifest.json
            out/youtube/accepted-output-short/release-review-pack/*.png
            out/youtube/accepted-output-short/release-review-pack/review-results.json
          retention-days: 7
