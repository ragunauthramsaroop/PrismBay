name: PrismBay Buyer Acquisition Priority

on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/digital-conversion-campaign.mjs'
      - 'scripts/buyer-acquisition-worker.mjs'
      - 'scripts/buyer-acquisition-worker.test.mjs'
      - 'scripts/freellm-sales-worker.mjs'
      - 'scripts/freellm-sales-worker.test.mjs'
      - 'scripts/ci-freellmapi-bootstrap.sh'
      - 'scripts/ci-freellmapi-bootstrap.test.mjs'
      - 'scripts/owned-sales-page-worker.mjs'
      - 'scripts/owned-sales-page-worker.test.mjs'
      - 'scripts/sales-sitemap-sync.mjs'
      - 'scripts/sales-sitemap-sync.test.mjs'
      - 'scripts/indexnow-submit.mjs'
      - 'scripts/indexnow-submit.test.mjs'
      - 'scripts/sales-revenue-control.mjs'
      - '.github/workflows/buyer-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/digital-conversion-campaign.mjs'
      - 'scripts/buyer-acquisition-worker.mjs'
      - 'scripts/buyer-acquisition-worker.test.mjs'
      - 'scripts/freellm-sales-worker.mjs'
      - 'scripts/freellm-sales-worker.test.mjs'
      - 'scripts/ci-freellmapi-bootstrap.sh'
      - 'scripts/ci-freellmapi-bootstrap.test.mjs'
      - 'scripts/owned-sales-page-worker.mjs'
      - 'scripts/owned-sales-page-worker.test.mjs'
      - 'scripts/sales-sitemap-sync.mjs'
      - 'scripts/sales-sitemap-sync.test.mjs'
      - 'scripts/indexnow-submit.mjs'
      - 'scripts/indexnow-submit.test.mjs'
      - 'scripts/sales-revenue-control.mjs'
      - '.github/workflows/buyer-acquisition.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: prismbay-buyer-acquisition
  cancel-in-progress: true

jobs:
  acquire-buyers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify conversion worker safeguards
        run: node --test scripts/digital-conversion-campaign.test.mjs scripts/buyer-acquisition-worker.test.mjs scripts/freellm-sales-worker.test.mjs scripts/ci-freellmapi-bootstrap.test.mjs scripts/owned-sales-page-worker.test.mjs scripts/sales-sitemap-sync.test.mjs scripts/indexnow-submit.test.mjs

      - name: Build current buyer-to-checkout campaign from live offer
        run: node scripts/buyer-acquisition-worker.mjs

      - name: Start live FreeLLMAPI free-model router
        if: github.event_name != 'pull_request'
        env:
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        run: bash scripts/ci-freellmapi-bootstrap.sh

      - name: Run FreeLLM sales intelligence with safe fallback
        run: node scripts/freellm-sales-worker.mjs

      - name: Build revenue-focused owned sales pages
        run: node scripts/owned-sales-page-worker.mjs

      - name: Build Sales Revenue Control heartbeat
        run: node scripts/sales-revenue-control.mjs

      - name: Publish refreshed buyer pages, sitemap and revenue state
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          syncdir="$RUNNER_TEMP/prismbay-sales-pages"
          git fetch origin gh-pages
          git worktree add --detach "$syncdir" origin/gh-pages
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$syncdir/learn" "$syncdir/sales"
          cp -f growth-reports/owned-sales-pages/*.html "$syncdir/learn/"
          cp -f growth-reports/sales-revenue-control.json "$syncdir/sales/revenue-control.json"
          node scripts/sales-sitemap-sync.mjs "$syncdir/sitemap.xml"
          git -C "$syncdir" add learn sales/revenue-control.json sitemap.xml
          if ! git -C "$syncdir" diff --cached --quiet; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git -C "$syncdir" commit -m 'chore: refresh PrismBay revenue pages'
            git -C "$syncdir" pull --rebase origin gh-pages
            git -C "$syncdir" push origin HEAD:gh-pages
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Notify participating search engines about changed buyer guides
        if: github.event_name != 'pull_request' && (steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: node scripts/indexnow-submit.mjs

      - name: Maintain Sales Revenue Control issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('growth-reports/sales-revenue-control.json','utf8'));
            const title = 'PrismBay Sales Revenue Control';
            const h = s.funnelHealth || {};
            const o = s.activeOffer || {};
            const body = [
              '# PrismBay Sales Revenue Control',
              '',
              `**Checked:** ${s.checkedAt}`,
              `**Priority:** Paid sales from verified existing offers`,
              `**Active offer:** ${o.title ?? o.slug ?? 'unknown'}`,
              `**Price:** ${o.priceUsd != null ? '$' + o.priceUsd + ' USD' : 'unknown'}`,
              `**Positioning:** ${s.positioning ?? 'baseline'}`,
              `**Guide health:** ${h.guideHealthy ? 'PASS' : 'FAIL'}${h.guideHttpStatus ? ' (' + h.guideHttpStatus + ')' : ''}`,
              `**Checkout health:** ${h.checkoutHealthy ? 'PASS' : 'FAIL'}${h.checkoutHttpStatus ? ' (' + h.checkoutHttpStatus + ')' : ''}`,
              `**Demand miner:** ${h.demandMinerReady ? 'READY' : 'NOT READY'}`,
              `**Conversion writer:** ${h.conversionWriterReady ? 'READY' : 'NOT READY'}`,
              `**Sales acquisition loop:** ${h.loopHealthy ? 'HEALTHY' : 'BLOCKED'}`,
              '',
              `**Guide:** ${o.guideUrl ?? 'unavailable'}`,
              `**Checkout:** ${o.checkoutUrl ?? 'unavailable'}`,
              '',
              `**Next action:** ${s.nextAction}`,
              '',
              '## Commercial truth',
              '',
              'A GitHub acquisition run is not a sale. Revenue is reported only after a real paid Stripe event is observed.',
              'Cold email, fake urgency, deceptive claims, paid-ad spend and unauthorized social posting remain disabled.'
            ].join('\n');
            const {owner, repo} = context.repo;
            const {data} = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const existing = data.find(x => !x.pull_request && x.title === title);
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number:existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }

      - name: Retain buyer acquisition assets
        uses: actions/upload-artifact@v4
        with:
          name: buyer-acquisition-${{ github.run_id }}
          path: |
            growth-reports/buyer-acquisition-latest.json
            growth-reports/buyer-acquisition-latest.md
            growth-reports/freellm-sales-worker-latest.json
            growth-reports/sales-revenue-control.json
            growth-reports/owned-sales-pages/
          retention-days: 7

      - name: Summary
        run: |
          echo '## PrismBay Revenue Acquisition Loop' >> "$GITHUB_STEP_SUMMARY"
          echo 'Priority: convert qualified organic buyers into existing Stripe checkout visits.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cadence: every 30 minutes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Each production run validates checkout health, refreshes acquisition intelligence, publishes owned buyer pages when needed, updates revenue-control state, and notifies search engines only when buyer content changes.' >> "$GITHUB_STEP_SUMMARY"
          echo "FreeLLMAPI mode: ${FREELLMAPI_CI_MODE:-deterministic-fallback}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Revenue is never claimed without a paid Stripe transaction.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No cold email, paid advertising, deceptive claims, or automatic social posting is performed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Stop run-scoped FreeLLMAPI router
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/freellmapi-container-name" ]]; then
            docker rm -f "$(cat "$RUNNER_TEMP/freellmapi-container-name")" >/dev/null 2>&1 || true
          fi