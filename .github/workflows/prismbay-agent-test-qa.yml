name: PrismBay AI agent testing Short independent technical QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prismbay-agent-test-qa.yml

permissions:
  contents: write

concurrency:
  group: prismbay-agent-test-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install zero-cost media QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Correct any unsafe zero-decibel audio peak before final QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json
          root=Path('youtube-growth/media')
          video=root/'PB-AGENT-TEST-20261026_final.mp4'
          manifest_path=root/'PB-AGENT-TEST-20261026_manifest.json'
          test=subprocess.run(['ffmpeg','-hide_banner','-i',str(video),'-vn','-af','volumedetect','-f','null','-'],capture_output=True,text=True)
          m=re.search(r'max_volume:\s*(-?[0-9.]+) dB',test.stderr)
          if m and float(m.group(1))>=-0.1:
              tmp=video.with_name('PB-AGENT-TEST-20261026_master_tmp.mp4')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(video),'-c:v','copy','-af','volume=-3dB','-c:a','aac','-b:a','160k','-movflags','+faststart',str(tmp)],check=True)
              tmp.replace(video)
              data=json.loads(manifest_path.read_text())
              data['audio_mastering']='-3dB attenuation applied after independent QA detected 0dB peak'
              data['publication_approved']=False
              manifest_path.write_text(json.dumps(data,indent=2)+'\n')
              print('Applied -3dB audio mastering and preserved publication gate')
          else:
              print('Audio already has safe headroom')
          PY
      - name: Verify output and create independent visual evidence
        run: |
          python - <<'PY'
          import json,subprocess,re,hashlib
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          root=Path('youtube-growth/media')
          video=root/'PB-AGENT-TEST-20261026_final.mp4'
          manifest=json.loads((root/'PB-AGENT-TEST-20261026_manifest.json').read_text())
          assert manifest['channel_id']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          dest=Path('editorial/youtube/qa/PB-AGENT-TEST-20261026')
          dest.mkdir(parents=True,exist_ok=True)
          p=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(video)],capture_output=True,text=True,check=True)
          info=json.loads(p.stdout)
          dur=float(info['format']['duration'])
          streams=info['streams']
          v=next(s for s in streams if s['codec_type']=='video')
          a=next(s for s in streams if s['codec_type']=='audio')
          aud=subprocess.run(['ffmpeg','-hide_banner','-i',str(video),'-vn','-af','volumedetect','-f','null','-'],capture_output=True,text=True)
          pk=re.search(r'max_volume:\s*(-?[0-9.]+) dB',aud.stderr)
          av=re.search(r'mean_volume:\s*(-?[0-9.]+) dB',aud.stderr)
          peak=float(pk.group(1)) if pk else None
          mean=float(av.group(1)) if av else None
          thumbs=[]
          for i in range(8):
              at=dur*(0.035+(i+0.5)*0.93/8)
              out=dest/f'frame_{i+1:02d}.jpg'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(at),'-i',str(video),'-frames:v','1','-vf','scale=270:480','-q:v','3',str(out)],check=True)
              thumbs.append(Image.open(out).convert('RGB'))
          sheet=Image.new('RGB',(270*4,480*2),'#101825')
          for i,im in enumerate(thumbs):sheet.paste(im,((i%4)*270,(i//4)*480))
          sheet.save(dest/'contact_sheet.jpg',quality=85,optimize=True)
          def dhash(im):
              a=im.convert('L').resize((9,8))
              p=list(a.getdata());return sum(int(p[y*9+x]>p[y*9+x+1])<<(63-(y*8+x)) for y in range(8) for x in range(8))
          hashes=[dhash(im) for im in thumbs]
          unique=[]
          for h in hashes:
              if all((h^z).bit_count()>5 for z in unique):unique.append(h)
          checks={
              'sole_channel':manifest['channel_id']=='UCw2hs85TzIpdKwJtG-BSxzQ',
              'duration':49<=dur<=51.2,
              'vertical_1080x1920':v['width']==1080 and v['height']==1920,
              'h264_aac':v['codec_name']=='h264' and a['codec_name']=='aac',
              'audio_present':mean is not None,
              'no_digital_clipping':peak is not None and peak<=-0.1,
              'distinct_sampled_frames':len(unique)>=5,
              'not_published':not manifest['published'],
              'zero_ad_spend':manifest['paid_spend_usd']==0
          }
          report={'channel':'@PrismBayAI','experiment':'PB-AGENT-TEST-20261026',
                  'duration_seconds':dur,'bytes':video.stat().st_size,
                  'sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
                  'audio_peak_db':peak,'audio_mean_db':mean,
                  'sampled_distinct_scenes':len(unique),'checks':checks,
                  'technical_pass':all(checks.values()),
                  'narration_pronunciation_review':'PENDING',
                  'caption_text_accuracy_review':'PENDING',
                  'visual_review':'PENDING',
                  'publication_approved':False,'published':False,'paid_spend_usd':0}
          (dest/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit technical QA and keep publication blocked
        run: |
          git config user.name "PrismBay Growth Swarm QA"
          git config user.email "actions@users.noreply.github.com"
          git add editorial/youtube/qa/PB-AGENT-TEST-20261026/ youtube-growth/media/PB-AGENT-TEST-20261026_final.mp4 youtube-growth/media/PB-AGENT-TEST-20261026_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit original agent testing Short and preserve unpublished review gate"
            for i in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((i*3))
            done
            exit 1
          fi
