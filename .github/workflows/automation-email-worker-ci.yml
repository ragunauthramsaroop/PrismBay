name: PrismBay Strict Email Worker CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/automation-email-worker-protocol.mjs'
      - 'scripts/automation-email-worker-protocol.test.mjs'
      - 'scripts/run-automation-email-worker.ts'
      - 'src/lib/automation-email-worker.ts'
      - 'src/lib/automation-email-production.ts'
      - 'scripts/automation-recipient-envelope.mjs'
      - 'package.json'
      - 'docs/AUTOMATION_EMAIL_WORKER.md'
      - '.github/workflows/automation-email-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/automation-email-worker-protocol.mjs'
      - 'scripts/automation-email-worker-protocol.test.mjs'
      - 'scripts/run-automation-email-worker.ts'
      - 'src/lib/automation-email-worker.ts'
      - 'src/lib/automation-email-production.ts'
      - 'scripts/automation-recipient-envelope.mjs'
      - 'package.json'
      - 'docs/AUTOMATION_EMAIL_WORKER.md'
      - '.github/workflows/automation-email-worker-ci.yml'

permissions:
  contents: read

jobs:
  strict-worker-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without mutating repository metadata
        run: npm install --no-package-lock
      - name: Run worker protocol and envelope tests
        run: node --test scripts/automation-email-worker-protocol.test.mjs scripts/automation-recipient-envelope.test.mjs
      - name: Typecheck worker wiring and existing strict production bridge
        run: >-
          npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler
          --skipLibCheck --allowJs --checkJs false --esModuleInterop --allowSyntheticDefaultImports
          scripts/run-automation-email-worker.ts
          src/lib/automation-email-worker.ts
          src/lib/automation-email-production.ts
          src/lib/automation-email-ledger.ts
          src/lib/clean-email-templates.ts
          src/lib/email.ts
      - name: Verify worker reuses strict delivery stack and stays default-off
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const worker = fs.readFileSync('src/lib/automation-email-worker.ts', 'utf8');
          const protocol = fs.readFileSync('scripts/automation-email-worker-protocol.mjs', 'utf8');
          const runner = fs.readFileSync('scripts/run-automation-email-worker.ts', 'utf8');
          if (!worker.includes('AUTOMATION_EMAIL_WORKER_ENABLED')) throw new Error('worker enable gate missing');
          if (!worker.includes('AUTOMATION_EMAIL_DELIVERY_ENABLED')) throw new Error('strict delivery gate missing');
          if (!worker.includes('createProductionAutomationEmailHandler')) throw new Error('existing production handler is not reused');
          if (!protocol.includes('/internal/automation/jobs/recipient-envelope')) throw new Error('encrypted recipient handoff missing');
          if (!protocol.includes('/internal/automation/jobs/ack')) throw new Error('durable acknowledgement missing');
          for (const source of [worker, protocol, runner]) {
            for (const forbidden of [
              'resend.emails.send(',
              '/order/createOrder',
              'shopping/order/createOrder',
              'stripe.checkout.sessions.create(',
              'publishProduct('
            ]) {
              if (source.includes(forbidden)) throw new Error(`forbidden duplicate or irreversible action embedded: ${forbidden}`);
            }
          }
          console.log('Strict email worker remains default-off and reuses the existing delivery stack.');
          NODE
