name: PrismBay Shorts caption preflight
on:
  push:
    paths:
      - 'youtube-growth/tools/validate_shorts_srt.py'
      - 'youtube-growth/tools/test_validate_shorts_srt.py'
      - 'youtube-growth/production/ai-agent-monitoring-2026-10-31-retention-candidate-15cue-2line-review.srt'
      - '.github/workflows/prismbay-shorts-caption-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-monitoring-retention-captions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python -m unittest discover -s youtube-growth/tools -p 'test_validate_shorts_srt.py' -v
      - name: Check candidate subtitles against known media duration
        run: |
          python youtube-growth/tools/validate_shorts_srt.py \
            youtube-growth/production/ai-agent-monitoring-2026-10-31-retention-candidate-15cue-2line-review.srt \
            --duration 46.96127 \
            --json-output caption-preflight.json
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-monitoring-retention-caption-preflight
          path: caption-preflight.json
          if-no-files-found: ignore
          retention-days: 7
