name: Whop payout destination readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/whop-payout-destination-readiness.yml'
      - 'scripts/whop-payout-destination-audit.mjs'
      - 'scripts/whop-payout-destination-audit.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/whop-payout-destination-readiness.yml'
      - 'scripts/whop-payout-destination-audit.mjs'
      - 'scripts/whop-payout-destination-audit.test.mjs'
  schedule:
    - cron: '19 14 * * *'

permissions:
  contents: read

jobs:
  check-whop-payout-destination:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Whop payout preflight safety
        run: node --test scripts/whop-payout-destination-audit.test.mjs
      - name: Check existing Whop payout methods without exposing account details
        if: github.event_name != 'pull_request'
        env:
          WHOP_COMPANY_API_KEY: ${{ secrets.WHOP_COMPANY_API_KEY }}
          WHOP_COMPANY_ID: ${{ vars.WHOP_COMPANY_ID }}
        run: node scripts/whop-payout-destination-audit.mjs
