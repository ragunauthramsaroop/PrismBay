name: PrismBay TikTok Direct Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/tiktok-publish.json'
      - 'config/tiktok-publish-lock.json'
      - 'config/legacy-live-catalog.json'
      - 'config/retail-promotions.json'
      - 'publish-requests/tiktok/*.json'
      - 'scripts/zernio-tiktok-publish.mjs'
      - 'scripts/zernio-tiktok-publish.test.mjs'
      - '.github/workflows/publish-tiktok-zernio.yml'
  push:
    branches: [main]
    paths:
      - 'config/tiktok-publish.json'
      - 'config/tiktok-publish-lock.json'
      - 'config/legacy-live-catalog.json'
      - 'config/retail-promotions.json'
      - 'publish-requests/tiktok/*.json'
      - 'scripts/zernio-tiktok-publish.mjs'
      - 'scripts/zernio-tiktok-publish.test.mjs'
      - '.github/workflows/publish-tiktok-zernio.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a Zernio dry-run or publish the verified TikTok post now'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - publish
      confirm_publish:
        description: 'For publish mode enter PUBLISH_PRISMBAY_TIKTOK'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: prismbay-tiktok-direct-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check publisher
        run: node --check scripts/zernio-tiktok-publish.mjs

      - name: Run publisher guardrail tests
        run: node --test scripts/zernio-tiktok-publish.test.mjs

      - name: Verify the configured public video exists
        shell: bash
        run: |
          set -euo pipefail
          video_url=$(node -e "const c=require('./config/tiktok-publish.json'); process.stdout.write(c.product.videoUrl)")
          status=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --range 0-0 "$video_url")
          test "$status" = '200' -o "$status" = '206'
          echo "Verified PrismBay-hosted media: HTTP $status"

  manual:
    if: "${{ github.event_name == 'workflow_dispatch' }}"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce TikTok publishing lock
        shell: bash
        run: |
          set -euo pipefail
          node -e "const l=require('./config/tiktok-publish-lock.json'); if(l.locked){console.error('TikTok publishing is locked: '+l.reason); process.exit(1)}"

      - name: Require explicit publish confirmation
        if: "${{ inputs.mode == 'publish' }}"
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PUBLISH" = 'PUBLISH_PRISMBAY_TIKTOK'

      - name: Require Zernio API secret
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZERNIO_API_KEY"
          echo 'ZERNIO_API_KEY is configured.'

      - name: Run Zernio preflight and manual route
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          RUN_MODE: ${{ inputs.mode }}
          PRISMBAY_PUBLISH_REQUEST_ID: manual-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_MODE" = 'publish' ]; then
            node scripts/zernio-tiktok-publish.mjs --publish
          else
            node scripts/zernio-tiktok-publish.mjs
          fi

      - name: Publish sanitized execution receipt to job summary
        shell: bash
        run: |
          set -euo pipefail
          echo '## PrismBay TikTok Zernio result' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/tiktok-publish/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized TikTok receipt
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-tiktok-zernio-manual-${{ github.run_id }}
          path: build/tiktok-publish/receipt.json
          if-no-files-found: error
          retention-days: 14

  approved-request:
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'publish(tiktok)') }}"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce TikTok publishing lock
        shell: bash
        run: |
          set -euo pipefail
          node -e "const l=require('./config/tiktok-publish-lock.json'); if(l.locked){console.error('TikTok publishing is locked: '+l.reason); process.exit(1)}"

      - name: Resolve and validate publish request path
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='publish(tiktok): '
          case "$COMMIT_MESSAGE" in
            "$prefix"*) ;;
            *) echo 'Commit message is not an approved TikTok publish request.' >&2; exit 1 ;;
          esac
          request_id="${COMMIT_MESSAGE#"$prefix"}"
          if ! [[ "$request_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$ ]]; then
            echo 'Invalid request id in commit message.' >&2
            exit 1
          fi
          request_path="publish-requests/tiktok/${request_id}.json"
          test -f "$request_path"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "REQUEST_PATH=$request_path" >> "$GITHUB_ENV"

      - name: Require Zernio API secret
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZERNIO_API_KEY"
          echo 'ZERNIO_API_KEY is configured.'

      - name: Dry-run then publish approved request
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/zernio-tiktok-publish.mjs --publish --request "$REQUEST_PATH"

      - name: Publish sanitized execution receipt to job summary
        shell: bash
        run: |
          set -euo pipefail
          echo "## PrismBay TikTok publish request: $REQUEST_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/tiktok-publish/receipt.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized TikTok receipt
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-tiktok-zernio-${{ env.REQUEST_ID }}-${{ github.run_id }}
          path: build/tiktok-publish/receipt.json
          if-no-files-found: error
          retention-days: 14
