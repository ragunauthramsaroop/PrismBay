name: PrismBay CJ eBay Reply Watch

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cj-ebay-ticket-watch.mjs'
      - '.github/workflows/cj-ebay-ticket-watch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cj-ebay-ticket-watch.mjs'
      - '.github/workflows/cj-ebay-ticket-watch.yml'

permissions:
  contents: write

concurrency:
  group: prismbay-ebay-cj-api
  cancel-in-progress: false

jobs:
  watch-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate watcher
        run: node --check scripts/cj-ebay-ticket-watch.mjs
      - name: Check CJ ticket
        if: github.event_name != 'pull_request'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: node scripts/cj-ebay-ticket-watch.mjs
      - name: Publish sanitized reply status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          syncdir="$RUNNER_TEMP/prismbay-cj-watch-pages"
          git fetch origin gh-pages
          git worktree add --detach "$syncdir" origin/gh-pages
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$syncdir/marketplace/ebay"
          cp growth-reports/ebay/cj-ticket-watch.json "$syncdir/marketplace/ebay/cj-ticket-watch.json"
          git -C "$syncdir" add marketplace/ebay/cj-ticket-watch.json
          if ! git -C "$syncdir" diff --cached --quiet; then
            git -C "$syncdir" commit -m 'chore: publish CJ eBay reply status'
            git -C "$syncdir" pull --rebase origin gh-pages
            git -C "$syncdir" push origin HEAD:gh-pages
          fi
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## PrismBay CJ eBay Reply Watch' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f growth-reports/ebay/cj-ticket-watch.json ]]; then
            node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('growth-reports/ebay/cj-ticket-watch.json','utf8'));
          console.log(`Ticket: ${r.ticketNo}`);
          console.log(`Status: ${r.status}`);
          console.log(`Reply detected: ${r.replyDetected}`);
          console.log(`Next action: ${r.nextAction}`);
          JS
          else
            echo 'No ticket status generated in this PR-only validation run.' >> "$GITHUB_STEP_SUMMARY"
          fi
