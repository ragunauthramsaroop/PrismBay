name: Paper-only trading lab checks
on:
  push:
    branches: ["experiment/ai-paper-trading"]
    paths:
      - "papertrade/**"
      - "tests/test_core.py"
      - "tests/test_paper_research.py"
      - ".github/workflows/papertrade-ci.yml"
      - "README-PAPERTRADE.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papertrade-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paper-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate original offline simulator
        run: python -m unittest discover -s tests -p 'test_core.py' -v
      - name: Validate ML timing and journal integrity
        run: python -m unittest discover -s tests -p 'test_paper_research.py' -v
      - name: Generate synthetic code test
        run: python -m papertrade --demo --out artifacts/papertrade-demo
      - name: Generate real public BTC-USD price replay
        run: python -m papertrade --coinbase --out artifacts/coinbase-public
      - name: Walk-forward research on completed public BTC daily candles
        run: python -m papertrade.research_cli --coinbase --history-days 900 --out artifacts/research
      - name: Stage last recorded paper ledger, if any
        run: |
          if [ -f papertrade/state/ledger.json ]; then
            cp papertrade/state/ledger.json artifacts/ledger.json
          fi
      - name: Advance paper-only ledger through completed UTC bars
        run: python -m papertrade.ledger --coinbase --history-days 900 --state artifacts/ledger.json
      - name: Verify all reports are non-live and publish ledger snapshot to log
        run: |
          python - <<'PY'
          import json
          from papertrade.ledger import verify
          p=json.load(open('artifacts/papertrade-demo/report.json'))
          r=json.load(open('artifacts/research/walkforward.json'))
          l=json.load(open('artifacts/ledger.json'))
          assert p['mode']=='PAPER_ONLY' and p['not_proof_of_profitability'] is True
          assert r['status']=='RESEARCH_ONLY_NOT_VALIDATED'
          assert r['NOT_APPROVED_FOR_LIVE_TRADING'] is True
          assert r['data_source']=='COINBASE_PUBLIC_COMPLETED_BTC_USD'
          assert l['mode']=='PAPER_ONLY'
          verify(l)
          print('PAPER_LEDGER_JSON='+json.dumps(l,sort_keys=True,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-trading-research
          path: artifacts/
          retention-days: 30
