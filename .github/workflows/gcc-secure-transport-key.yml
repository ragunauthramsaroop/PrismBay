name: GCC Secure Transport Key

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gcc-secure-transport-key.yml'

permissions:
  contents: read

jobs:
  derive-public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ICLOUD_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
    steps:
      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$ICLOUD_PASSWORD" ]; then
            echo "::error::ICLOUD_APP_PASSWORD is missing."
            exit 1
          fi
      - name: Derive transport public key
        shell: bash
        run: |
          python -m pip install --quiet pynacl
          python - <<'PY'
          import base64, hashlib, os
          from nacl.public import PrivateKey

          secret = os.environ['ICLOUD_PASSWORD'].encode('utf-8')
          seed = hashlib.blake2b(
              secret,
              digest_size=32,
              person=b'GCCOutreachKey'
          ).digest()
          private_key = PrivateKey(seed)
          public_key = bytes(private_key.public_key)
          print('GCC_TRANSPORT_PUBLIC_KEY_B64=' + base64.b64encode(public_key).decode('ascii'))
          print('Only the public transport key was emitted. The iCloud credential was not printed.')
          PY
