name: PrismBay Retail Promotion Swarm

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['PrismBay CJ Supplier Verification']
    types: [completed]
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/retail-promotion-swarm.yml'
      - 'scripts/retail-promotion-swarm.mjs'
      - 'scripts/retail-promotion-swarm.test.mjs'
      - 'scripts/tiktok-retail-readiness.mjs'
      - 'scripts/first-sale-verifier.mjs'
      - 'scripts/retail-readiness-closure.test.mjs'
      - 'scripts/dropshipping-dispatch.mjs'
      - 'scripts/organic-growth-agent.mjs'
      - 'scripts/cj-review-board.mjs'

permissions:
  contents: read

concurrency:
  group: prismbay-retail-promotion-swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-swarm:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' && github.actor == 'ragunauthramsaroop' && startsWith(github.event.issue.title, '[RETAIL-GROWTH-SWARM]') && contains(github.event.comment.body, 'run retail growth swarm'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enforce retail safety and readiness tests
        run: >-
          node --test
          scripts/retail-promotion-swarm.test.mjs
          scripts/retail-readiness-closure.test.mjs
          scripts/cj-review-board.test.mjs
          scripts/cj-match-policy.test.mjs
          scripts/cj-freight-policy.test.mjs
          scripts/dropshipping-dispatch.test.mjs
          scripts/organic-growth-agent.test.mjs
          scripts/board-freshness.test.mjs

      - name: Run all existing retail growth workers
        shell: bash
        run: |
          set -uo pipefail
          roles=('Trend Scout' 'Hook/Creative Writer' 'Storefront CRO Auditor' 'Creator/Partner Scout' 'Publisher' 'Analytics Reviewer' 'Offer Optimizer' 'GitHub Support Scout')
          failed=0
          for role in "${roles[@]}"; do
            echo "Running $role"
            if ! node scripts/organic-growth-agent.mjs "$role"; then
              echo "::error::Worker failed unexpectedly: $role"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more workers had a code or runtime fault. Network reachability failures are recorded as degraded evidence and do not reach this branch."
            exit 1
          fi

      - name: Refresh worker assignments from supplier evidence
        run: node scripts/dropshipping-dispatch.mjs

      - name: Build fail-closed retail promotion plan
        run: node scripts/retail-promotion-swarm.mjs

      - name: Build TikTok retail readiness evidence
        run: node scripts/tiktok-retail-readiness.mjs

      - name: Verify first non-test paid sale evidence
        run: node scripts/first-sale-verifier.mjs

      - name: Verify no blocked product leaked into promotion lanes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('growth-reports/retail-promotion-swarm.json', 'utf8'));
          const storefront = JSON.parse(fs.readFileSync('growth-reports/storefront-cro-auditor.json', 'utf8'));
          if (!report.reviewFresh && report.promotionEligibleCount !== 0) throw new Error('Stale supplier evidence released a promotion');
          if (report.promotionEligibleCount !== report.trackedOffers.length) throw new Error('Tracked offer count does not match eligible products');
          for (const item of report.promotionEligible) {
            if (!item.promotionEligible || item.missing.length) throw new Error(`Blocked product leaked into promotion: ${item.slug}`);
          }
          if (report.promotionEligibleCount === 0 && storefront?.result?.activeStorefront?.hasProductSchema === true) {
            throw new Error('Product offer schema leaked while no physical product is promotion eligible');
          }
          console.log(`Promotion eligible: ${report.promotionEligibleCount}`);
          NODE

      - name: Retain retail swarm outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prismbay-retail-promotion-swarm-${{ github.run_id }}
          path: |
            growth-reports/retail-promotion-swarm.json
            growth-reports/tiktok-retail-readiness.json
            growth-reports/first-sale-verification.json
            growth-reports/dropshipping-worker-board.json
            growth-reports/trend-scout.json
            growth-reports/hook-creative-writer.json
            growth-reports/storefront-cro-auditor.json
            growth-reports/creator-partner-scout.json
            growth-reports/publisher.json
            growth-reports/analytics-reviewer.json
            growth-reports/offer-optimizer.json
            growth-reports/github-support-scout.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write execution status
        if: always()
        shell: bash
        run: |
          echo 'The retail swarm runs all eight existing growth roles and the supplier-aware dispatch controller.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Transient network failures are retried and recorded as degraded evidence instead of aborting the swarm.' >> "$GITHUB_STEP_SUMMARY"
          echo 'External product promotion stays blocked until every supplier, final-freight, rights, checkout and promotion gate passes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'TikTok readiness and first-sale evidence are independently fail-closed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The educational YouTube channel is excluded from retail distribution.' >> "$GITHUB_STEP_SUMMARY"
