name: Prime PrismBay Railway Live Quote

on:
  push:
    branches: [main]
    paths:
      - 'services/railway-clean-quote/**'
      - '.github/workflows/prime-railway-clean-quote.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: prismbay-railway-live-quote-prime
  cancel-in-progress: true

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
      QUOTE_ORIGIN: https://browser-worker-production-f5b4.up.railway.app
      STOREFRONT_ORIGIN: https://clean.prismbayai.com
    steps:
      - name: Validate required secret exists
        shell: bash
        run: |
          test -n "$CJ_API_KEY" || { echo 'CJ_API_KEY is not configured'; exit 1; }
      - name: Prime Railway quote service securely
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          (async () => {
            const apiKey = process.env.CJ_API_KEY;
            const origin = process.env.QUOTE_ORIGIN;
            const timestamp = Date.now();
            const proof = crypto.createHmac('sha256', apiKey)
              .update(`${timestamp}:prismbay-clean-quote-bootstrap`)
              .digest('hex');
            const response = await fetch(`${origin}/internal/bootstrap`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ apiKey, timestamp, proof }),
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.ready !== true) {
              console.error(`Prime failed with HTTP ${response.status}: ${body.error || 'unknown_error'}`);
              process.exit(1);
            }
            console.log('Railway live quote service primed successfully.');
          })().catch(error => {
            console.error(`Prime request failed: ${error.name || 'request_error'}`);
            process.exit(1);
          });
          NODE
      - name: Verify service is ready
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(`${process.env.QUOTE_ORIGIN}/health`, { headers: { accept: 'application/json' } });
            const body = await response.json();
            if (!response.ok || body.ready !== true || body.automaticSupplierOrdering !== false) process.exit(1);
            console.log(`Live quote health verified for ${body.product}.`);
          })().catch(() => process.exit(1));
          NODE
      - name: Verify storefront CORS and non-payment buyer path
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const api = `${process.env.QUOTE_ORIGIN}/v1/quote`;
            const storefront = process.env.STOREFRONT_ORIGIN;
            const preflight = await fetch(api, {
              method: 'OPTIONS',
              headers: {
                origin: storefront,
                'access-control-request-method': 'POST',
                'access-control-request-headers': 'content-type'
              }
            });
            if (preflight.status !== 204 || preflight.headers.get('access-control-allow-origin') !== storefront) {
              console.error(`CORS preflight failed with HTTP ${preflight.status}.`);
              process.exit(1);
            }

            const quote = await fetch(api, {
              method: 'POST',
              headers: { origin: storefront, 'content-type': 'application/json' },
              body: JSON.stringify({ zip: '10001' })
            });
            const body = await quote.json().catch(() => ({}));
            const cors = quote.headers.get('access-control-allow-origin');
            if (cors !== storefront) {
              console.error('Quote response is missing the storefront CORS header.');
              process.exit(1);
            }
            if (![200, 409].includes(quote.status)) {
              console.error(`Buyer-path probe failed with HTTP ${quote.status}: ${body.error || 'unknown_error'}`);
              process.exit(1);
            }
            if (body.checkoutUrl) {
              console.error('Non-payment probe unexpectedly returned checkout authorization on the first request.');
              process.exit(1);
            }
            console.log(`Buyer-path probe completed safely with HTTP ${quote.status}; no payment or supplier order was initiated.`);
          })().catch(error => {
            console.error(`Buyer-path probe failed: ${error.name || 'request_error'}`);
            process.exit(1);
          });
          NODE
