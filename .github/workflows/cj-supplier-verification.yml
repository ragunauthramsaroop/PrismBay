name: PrismBay CJ Supplier Verification

# Uses the repository secret CJ_API_KEY only inside GitHub-hosted runners.
# Fails closed on product name, variant inventory, price and freight estimates.
# Read-only: no orders, payments, listing, email or publishing.
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *' # Six bounded supplier-research batches/day: 9 live candidates + the Top 15 shortlist + research alternates
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cj-supplier-verification.yml'
      - 'services/physical-orders/live-catalog-candidates.json'
      - 'config/top15-merchandising.json'
      - 'scripts/cj-match-policy.mjs'
      - 'scripts/cj-match-policy.test.mjs'
      - 'scripts/cj-review-board.mjs'
      - 'scripts/cj-search-strategy.mjs'
      - 'scripts/cj-search-strategy.test.mjs'
      - 'scripts/cj-freight-policy.mjs'
      - 'scripts/cj-freight-policy.test.mjs'

permissions:
  contents: write

concurrency:
  group: prismbay-commerce-board-writers
  cancel-in-progress: false

jobs:
  verify-cj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate and verify CJ supplier data
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {hasApprovedProductClass, matchesIntendedProduct} from './scripts/cj-match-policy.mjs';
          import { parseCJFreight, parseCJFreightTip, freightRequest, freightTipRequest, chooseQuote } from './scripts/cj-freight-policy.mjs';
          import { createCJReadOnlyClient } from './scripts/cj-api-limiter.mjs';
          import { candidateSearches, uniqueEligibleProducts, selectBestInspection } from './scripts/cj-search-strategy.mjs';
          
          // Explicit product-class requirements prevent CJ's fuzzy search from selecting
          // unrelated merchandise. New categories remain unverified until reviewed.
          function positiveNumber(value) {
            if (value === null || value === undefined || typeof value === 'boolean' || String(value).trim() === '') return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
          }
          
          function count(value) {
            const n = positiveNumber(value);
            return n !== null && Number.isInteger(n) ? n : 0;
          }
          
          function price(item, variant = null) {
            return positiveNumber(variant?.variantSellPrice) ??
              positiveNumber(item?.nowPrice) ??
              positiveNumber(item?.discountPrice) ??
              positiveNumber(item?.sellPrice);
          }
          
          function eligibleProducts(products, candidate, {requireUsWarehouse = true} = {}) {
            return products.filter(item =>
              String(item?.saleStatus) === '3' &&
              price(item) !== null &&
              matchesIntendedProduct(candidate, item?.nameEn) &&
              (!requireUsWarehouse || (
                Number(item?.verifiedWarehouse) === 1 &&
                count(item?.totalVerifiedInventory) >= 10
              ))
            ).sort((a, b) => count(b.totalVerifiedInventory) - count(a.totalVerifiedInventory));
          }

          function pickPhysicalStock(stockRows, vid) {
            const rows = stockRows.filter(row =>
              String(row?.vid || '') === String(vid) &&
              /^[A-Z]{2}$/.test(String(row?.countryCode || '').toUpperCase()) &&
              count(row?.totalInventoryNum) >= 10 &&
              count(row?.cjInventoryNum) >= 1
            );
            const rank = code => code === 'US' ? 0 : code === 'CN' ? 1 : 2;
            rows.sort((a, b) => {
              const ac = String(a.countryCode || '').toUpperCase();
              const bc = String(b.countryCode || '').toUpperCase();
              return rank(ac) - rank(bc) || count(b.cjInventoryNum) - count(a.cjInventoryNum);
            });
            return rows[0] || null;
          }
          
          // Reproduce the false positives from the first live run and fail before
          // connecting to CJ if a later edit removes these safeguards.
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'VEVOR Stand Airless Paint Sprayer'), false);
          assert.equal(matchesIntendedProduct({slug:'hanging-closet-organizer'}, 'Shoe Cabinet With 2 Flip Drawers'), false);
          assert.equal(matchesIntendedProduct({slug:'roll-up-dish-rack'}, 'Flower Print Lace-up Sneakers'), false);
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'Cordless Portable Handheld Vacuum Cleaner'), true);
          assert.equal(positiveNumber(null), null);
          assert.equal(positiveNumber(0), null);
          assert.equal(positiveNumber('0'), null);
          assert.equal(positiveNumber('9.64'), 9.64);
          assert.equal(price({nowPrice:0, discountPrice:null, sellPrice:'23.50'}), 23.5);
          assert.equal(eligibleProducts([{nameEn:'VEVOR Stand Airless Paint Sprayer', saleStatus:'3', verifiedWarehouse:1, totalVerifiedInventory:3835, sellPrice:55}], {slug:'cordless-handheld-vacuum'}).length, 0);
          console.log('Product-matching, price and prior false-positive safeguards PASS');
          assert.equal(matchesIntendedProduct({slug:'cordless-handheld-vacuum'}, 'VEVOR Wet Dry Vac, 2.6 Gallon, Portable Shop Vacuum'), false);
          assert.equal(matchesIntendedProduct({slug:'hanging-closet-organizer'}, 'Wall-door Mounted Jewelry Wardrobe Large Capacity Mirror And LED Light Lockable Organizer'), false);
          if (process.env.CJ_AUDIT_SELF_TEST_ONLY === '1') process.exit(0);
          
          const apiKey = String(process.env.CJ_API_KEY || '').trim();
          if (!apiKey) throw new Error('CJ_API_KEY repository secret is missing.');
          const BASE = 'https://developers.cjdropshipping.com/api2.0/v1';
          const headers = token => ({
            'CJ-Access-Token': token,
            'Content-Type': 'application/json',
            'User-Agent': 'PrismBay-CJ-Verification/2.0',
          });
          // Enforce free-tier request pacing and bounded 429 retry across authentication,
          // product search, variant stock and the two shipping-quote attempts.
          const jsonFetch = createCJReadOnlyClient();

          const auth = await jsonFetch(BASE + '/authentication/getAccessToken', {
            method: 'POST',
            headers: {'Content-Type':'application/json','User-Agent':'PrismBay-CJ-Verification/2.0'},
            body: JSON.stringify({apiKey}),
          });
          const token = String(auth?.data?.accessToken || '');
          if (!token) throw new Error('CJ authentication succeeded without an access token.');
          console.log('::add-mask::' + token);
          console.log('CJ authentication PASS');
          
          const researchCatalog = JSON.parse(await fs.readFile('public/viral-candidates.json', 'utf8'));
          const liveCatalog = JSON.parse(await fs.readFile('services/physical-orders/live-catalog-candidates.json', 'utf8'));
          const shortlist = JSON.parse(await fs.readFile('config/top15-merchandising.json', 'utf8'));
          if (!Array.isArray(shortlist.candidates) || shortlist.candidates.length !== 15) {
            throw new Error('Top 15 merchandising candidates must contain exactly 15 reviewed entries');
          }
          const liveCandidates = Array.isArray(liveCatalog?.candidates) ? liveCatalog.candidates.slice(0, 9) : [];
          const seen = new Set(liveCandidates.map(item => item.slug));
          const shortlistResearch = shortlist.candidates
            .filter(item => typeof item.slug === 'string' && !seen.has(item.slug))
            .map(item => ({ slug:item.slug, name:item.name, query:item.name.toLowerCase(), retailPriceUsd:0, liveStoreProduct:false }));
          for (const candidate of shortlistResearch) seen.add(candidate.slug);
          const researchCandidates = (Array.isArray(researchCatalog?.candidates) ? researchCatalog.candidates : [])
            .filter(item => typeof item.slug === 'string' && !seen.has(item.slug)).slice(0, 2);
          const allCandidates = [...liveCandidates, ...shortlistResearch, ...researchCandidates];
          if (new Set(allCandidates.map(item => item.slug)).size !== allCandidates.length) {
            throw new Error('Duplicate supplier verification slug');
          }
          // Six 3-candidate batches/day rotate through 15 storefront picks and two research fallbacks.
          // Scheduled runs stay rate-limited to three products per window.
          // Policy/catalog code changes immediately rescreen the whole read-only shortlist
          // so newly added sourcing categories do not wait for the next rotation.
          const scheduled = process.env.GITHUB_EVENT_NAME === 'schedule';
          const slot = scheduled ? Math.floor(new Date().getUTCHours() / 4) : null;
          const candidates = scheduled
            ? Array.from({length:Math.min(3, allCandidates.length)}, (_,index)=>allCandidates[(slot * 3 + index) % allCandidates.length])
            : allCandidates;
          if (candidates.length === 0) throw new Error('No supplier-verification candidates are available.');
          function flatten(payload) {
            const groups = payload?.data?.content;
            return Array.isArray(groups) ? groups.flatMap(group => Array.isArray(group?.productList) ? group.productList : []) : [];
          }
          
          const results = [];
          for (const candidate of candidates) {
            const base = {
              slug:String(candidate?.slug || ''), candidate: String(candidate?.name || ''), query: String(candidate?.query || ''),
              liveStoreProduct:Boolean(candidate?.liveStoreProduct),
              retailPriceUsd:positiveNumber(candidate?.retailPriceUsd),
              supplierVerified: false, variantInventoryVerified: false,
              freightVerified: false, fulfillmentReady: false,
            };
            if (!hasApprovedProductClass(candidate?.slug)) {
              results.push({...base, status:'manual_category_review', reason:'Candidate has no approved product-class validation rule.'});
              continue;
            }
            const eligibleGroups = [];
            let candidatesReturned = 0;
            let searchesAttempted = 0;
            let searchErrors = 0;
            let globalFallbackAttempted = false;
            const searches = candidateSearches(candidate);

            // Prefer CJ-held US stock. This is the fastest and lowest-risk route.
            for (const query of searches) {
              searchesAttempted += 1;
              const url = new URL(BASE + '/product/listV2');
              url.searchParams.set('page', '1');
              url.searchParams.set('size', '40');
              url.searchParams.set('keyWord', query);
              url.searchParams.set('countryCode', 'US');
              url.searchParams.set('startWarehouseInventory', '10');
              url.searchParams.set('verifiedWarehouse', '1');
              url.searchParams.set('sort', 'desc');
              url.searchParams.set('orderBy', '0');
              url.searchParams.append('features', 'enable_category');
              let search;
              try {
                search = await jsonFetch(url, { headers: headers(token) });
              } catch (error) {
                searchErrors += 1;
                if (String(error?.message || '').includes('1600201')) break;
                continue;
              }
              const products = flatten(search);
              candidatesReturned += products.length;
              eligibleGroups.push(eligibleProducts(products, candidate, {requireUsWarehouse:true}));
              if (uniqueEligibleProducts(eligibleGroups, 3).length >= 3) break;
            }

            // If US inventory is unavailable, inspect a tightly bounded global
            // fallback. The later variant-stock check still requires physical CJ
            // inventory and the freight check must price delivery to the US.
            if (!uniqueEligibleProducts(eligibleGroups, 3).length && searchErrors < searchesAttempted) {
              globalFallbackAttempted = true;
              for (const query of searches.slice(0, 2)) {
                searchesAttempted += 1;
                const url = new URL(BASE + '/product/listV2');
                url.searchParams.set('page', '1');
                url.searchParams.set('size', '40');
                url.searchParams.set('keyWord', query);
                url.searchParams.set('sort', 'desc');
                url.searchParams.set('orderBy', '0');
                url.searchParams.append('features', 'enable_category');
                let search;
                try {
                  search = await jsonFetch(url, { headers: headers(token) });
                } catch (error) {
                  searchErrors += 1;
                  if (String(error?.message || '').includes('1600201')) break;
                  continue;
                }
                const products = flatten(search);
                candidatesReturned += products.length;
                eligibleGroups.push(eligibleProducts(products, candidate, {requireUsWarehouse:false}));
                if (uniqueEligibleProducts(eligibleGroups, 3).length >= 3) break;
              }
            }

            const eligible = uniqueEligibleProducts(eligibleGroups, 3);
            if (!eligible.length) {
              results.push({...base,
                status: searchErrors === searchesAttempted ? 'search_error' : 'manual_supplier_match_required',
                candidatesReturned, searchesAttempted, searchErrors, globalFallbackAttempted,
                reason: searchErrors === searchesAttempted ?
                  'All bounded CJ supplier searches failed; await a fresh read-only run.' :
                  'No approved query returned a matching on-sale product with a positive price after US and bounded global sourcing checks.',
              });
              continue;
            }

            const inspected = [];
            for (const item of eligible) {

            // Variant identity and physical inventory come from CJ's dedicated
            // endpoints. Prefer US stock, then CN, then another CJ-held origin.
            const variantsUrl = new URL(BASE + '/product/variant/query');
            variantsUrl.searchParams.set('pid', String(item.id));
            let variant = null;
            let variantInventoryVerified = false;
            let originCountryCode = null;
            let variantCheck = 'variant_details_unavailable';
            try {
              const variantsResponse = await jsonFetch(variantsUrl, { headers: headers(token) });
              const variants = Array.isArray(variantsResponse?.data) ? variantsResponse.data : [];
              variantCheck = 'manual_variant_inventory_check_required';
              for (const choice of variants.slice(0, 7)) {
                if (String(choice?.pid || '') !== String(item.id) || !choice?.vid ||
                    positiveNumber(choice?.variantSellPrice) === null) continue;
                const stockUrl = new URL(BASE + '/product/stock/queryByVid');
                stockUrl.searchParams.set('vid', String(choice.vid));
                let stockResponse;
                try { stockResponse = await jsonFetch(stockUrl, { headers: headers(token) }); }
                catch { continue; }
                const stockRows = Array.isArray(stockResponse?.data) ? stockResponse.data : [];
                const stock = pickPhysicalStock(stockRows, choice.vid);
                if (!stock) continue;
                variant = choice;
                originCountryCode = String(stock.countryCode).toUpperCase();
                variantInventoryVerified = true;
                variantCheck = 'verified_' + originCountryCode.toLowerCase() + '_cj_stock';
                break;
              }
            } catch {
              variantCheck = 'variant_details_unavailable';
            }

            // Verify shipping independently of the supplier match. A zero-dollar
            // result is ambiguous, NOT evidence of approved free shipping.
            // Start with CJ's simple country estimate. When it is unusable, use
            // CJ's documented Freight Calculation Tip with verified variant
            // dimensions, weight and product logistics properties. An illustrative
            // ZIP is still only a trial quote and never validates a buyer's address.
            const freightOptions = [];
            let zeroPriceQuoteCount = 0;
            let freightQuoteScope = null;
            let freightDiagnostic = variantInventoryVerified ? 'not_quoted' : 'variant_stock_unverified';
            if (variantInventoryVerified && variant?.vid) {
              let countryQuote = null;
              let tipQuote = null;
              let exampleQuote = null;
              try {
                const country = await jsonFetch(BASE + '/logistic/freightCalculate', {
                  method:'POST', headers:headers(token),
                  body:JSON.stringify(freightRequest(String(variant.vid), null, originCountryCode)),
                });
                countryQuote = parseCJFreight(country, 'country_estimate');
              } catch {
                freightDiagnostic = 'country_quote_api_error';
              }

              if (!countryQuote?.offers.length) {
                try {
                  const detailUrl = new URL(BASE + '/product/query');
                  detailUrl.searchParams.set('pid', String(item.id));
                  const detailResponse = await jsonFetch(detailUrl, { headers: headers(token) });
                  const zip = '10001'; // Illustrative NYC ZIP only, never a customer delivery quote
                  const tip = await jsonFetch(BASE + '/logistic/freightCalculateTip', {
                    method:'POST', headers:headers(token),
                    body:JSON.stringify(freightTipRequest({
                      variant,
                      detail: detailResponse?.data,
                      zip,
                      origin: originCountryCode,
                    })),
                  });
                  tipQuote = parseCJFreightTip(tip, 'tip_example_zip_estimate', zip);
                  if (tip?.code === 1600300 && !tipQuote.offers.length) {
                    freightDiagnostic = 'tip_request_rejected';
                  }
                } catch {
                  freightDiagnostic = 'tip_quote_unavailable';
                }
              }

              // Preserve one simple illustrative-ZIP fallback if CJ Tip metadata is
              // unavailable for an older catalog record.
              if (!countryQuote?.offers.length && !tipQuote?.offers.length) {
                try {
                  const zip = '10001';
                  const sample = await jsonFetch(BASE + '/logistic/freightCalculate', {
                    method:'POST', headers:headers(token),
                    body:JSON.stringify(freightRequest(String(variant.vid), zip, originCountryCode)),
                  });
                  exampleQuote = parseCJFreight(sample, 'example_zip_estimate', zip);
                } catch {
                  if (freightDiagnostic === 'not_quoted') freightDiagnostic = 'illustrative_zip_quote_api_error';
                }
              }

              const evaluated = chooseQuote(
                countryQuote || parseCJFreight({data:[]}),
                exampleQuote,
                tipQuote,
              );
              freightOptions.push(...evaluated.offers);
              zeroPriceQuoteCount = evaluated.zeroPriced;
              freightQuoteScope = evaluated.scope;
              if (freightOptions.length) freightDiagnostic = evaluated.diagnostic;
              else if (evaluated.zeroPriced) freightDiagnostic = 'zero_priced_methods_require_supplier_confirmation';
              else if (freightDiagnostic === 'not_quoted') freightDiagnostic = evaluated.diagnostic;
            }

            inspected.push({...base,
              supplierVerified:true,
              variantInventoryVerified,
              freightVerified:variantInventoryVerified && freightOptions.length > 0,
              status: !variantInventoryVerified ? 'supplier_product_matched_variant_pending' :
                !freightOptions.length ? 'supplier_matched_freight_pending' : 'supplier_matched_freight_estimate',
              product:{
                id:String(item.id), sku:item.sku || item.spu || null,
                name:item.nameEn, productCostUsd:price(item,variant),
                verifiedProductInventory:count(item.totalVerifiedInventory),
                warehouse:originCountryCode, variantId:variant?.vid || null, variantSku:variant?.variantSku || null,
              }, variantCheck, originCountryCode, zeroPriceQuoteCount, freightOptions, freightQuoteScope, freightDiagnostic,
              shippingDisclaimer:(originCountryCode || 'Unknown origin') + '-to-US estimate only. Confirm the actual buyer ZIP, carrier, variant, total landed cost, delivery timing and supplier acceptance before any sale.',
              fulfillmentNote:'No ordering, payment, listing or automatic publishing is enabled.',
            });
              if (freightOptions.length) break;
            }
            const best = selectBestInspection(inspected);
            results.push({...best, alternativesInspected:inspected.length, searchesAttempted,searchErrors,candidatesReturned,globalFallbackAttempted,
              alternativeNote:'A supplier match never authorizes a listing. Every inspected alternative requires independent variant, physical inventory and freight checks.'});
          }

          const report = {
            schemaVersion:5, checkedAt:new Date().toISOString(), market:'US',
            verificationMode:scheduled ? 'scheduled_batch' : 'live_catalog_priority',
            batchSlot:slot, catalogCandidateCount:allCandidates.length,
            liveCatalogCandidateCount:liveCandidates.length,
            researchCandidateCount:researchCandidates.length,
            authentication:'verified', apiKeyExposed:false, accessTokenExposed:false,
            ordersEnabled:false, paymentsEnabled:false, automaticListingEnabled:false, automaticPublishingEnabled:false,
            candidateCount:results.length,
            supplierVerifiedCount:results.filter(x=>x.supplierVerified).length,
            variantInventoryVerifiedCount:results.filter(x=>x.variantInventoryVerified).length,
            freightEstimateCount:results.filter(x=>x.freightVerified).length,
            allRequireManualCommercialApproval:true,
            results,
          };
          await fs.mkdir('growth-reports',{recursive:true});
          await fs.writeFile('growth-reports/cj-supplier-verification.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({authentication:report.authentication,candidates:report.candidateCount,
            matchedSupplierProducts:report.supplierVerifiedCount,verifiedVariants:report.variantInventoryVerifiedCount,
            estimatedFreight:report.freightEstimateCount,ordersEnabled:false}));
          JS

      - name: Independently audit product identity and prepare worker assignments
        run: |
          node --test scripts/cj-search-strategy.test.mjs scripts/cj-api-limiter.test.mjs scripts/cj-match-policy.test.mjs scripts/cj-freight-policy.test.mjs scripts/cj-review-board.test.mjs
          node scripts/cj-review-board.mjs
          node scripts/dropshipping-dispatch.mjs

      - name: Update sanitized public worker review, not the raw supplier report
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Rebuild against the latest branch rather than rebasing generated JSON.
          source_report="$PWD/growth-reports/cj-supplier-verification.json"
          syncdir="$RUNNER_TEMP/prismbay-cj-review-publisher"
          git fetch origin main
          git worktree add --detach "$syncdir" origin/main
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git -C "$syncdir" reset --hard origin/main
            (
              cd "$syncdir"
              SOURCE_REPORT="$source_report" node --input-type=module -e "import { main } from './scripts/cj-review-board.mjs'; await main(process.env.SOURCE_REPORT);"
              node scripts/dropshipping-dispatch.mjs
              git add -f growth-reports/cj-worker-review.json growth-reports/dropshipping-worker-board.json
              if git diff --cached --quiet; then exit 0; fi
              git commit -m 'chore: update safe read-only CJ worker review'
            )
            git -C "$syncdir" push origin HEAD:main && exit 0
            sleep "$((attempt * 2))"
          done
          exit 1

      - name: Retain CJ verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cj-supplier-verification-${{ github.run_id }}
          path: |
            growth-reports/cj-supplier-verification.json
            growth-reports/cj-worker-review.json
            growth-reports/dropshipping-worker-board.json
          if-no-files-found: error
          retention-days: 7
