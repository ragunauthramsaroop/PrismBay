name: PrismDeck Studio CI

on:
  push:
    branches:
      - feature/prismdeck-premium-studio-20261024
    paths:
      - "apps/prismdeck-studio/**"
      - ".github/workflows/prismdeck-studio-ci.yml"
  pull_request:
    paths:
      - "apps/prismdeck-studio/**"
      - ".github/workflows/prismdeck-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build PowerPoint studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/prismdeck-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run model and real PowerPoint export tests
        run: npm test
      - name: Production bundle
        run: npm run build
      - name: Verify bundled index
        run: test -s dist/index.html
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise live editor and download a PowerPoint
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/prismdeck-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismdeck-browser-preview
          path: apps/prismdeck-studio/test-artifacts/
          if-no-files-found: ignore
