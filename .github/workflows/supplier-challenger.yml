name: PrismBay Supplier Challenger

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/supplier-challenger-worker.mjs'
      - 'scripts/supplier-challenger-worker.test.mjs'
      - 'scripts/paperclip-cj-sourcing.mjs'
      - 'scripts/cj-match-policy.mjs'
      - 'scripts/cj-freight-policy.mjs'
      - 'scripts/freight-ceiling-engine.mjs'
      - 'paperclip/prismbay-global-commerce/research/supplier-candidates.json'
      - 'services/physical-orders/live-catalog-candidates.json'
      - '.github/workflows/supplier-challenger.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/supplier-challenger-worker.mjs'
      - 'scripts/supplier-challenger-worker.test.mjs'
      - 'paperclip/prismbay-global-commerce/research/supplier-candidates.json'
      - 'services/physical-orders/live-catalog-candidates.json'
      - '.github/workflows/supplier-challenger.yml'

permissions:
  contents: write

concurrency:
  group: prismbay-supplier-challenger
  cancel-in-progress: false

jobs:
  safety-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/cj-api-limiter.test.mjs scripts/cj-match-policy.test.mjs scripts/cj-freight-policy.test.mjs scripts/freight-ceiling-engine.test.mjs scripts/paperclip-cj-sourcing.test.mjs scripts/supplier-challenger-worker.test.mjs

  challenge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only supplier diversification research
        run: |
          node --test scripts/cj-api-limiter.test.mjs scripts/cj-match-policy.test.mjs scripts/cj-freight-policy.test.mjs scripts/freight-ceiling-engine.test.mjs scripts/paperclip-cj-sourcing.test.mjs scripts/supplier-challenger-worker.test.mjs
          node scripts/supplier-challenger-worker.mjs
      - name: Publish sanitized challenger board
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add growth-reports/supplier-challenger-board.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh supplier challenger board'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-challenger-${{ github.run_id }}
          path: growth-reports/supplier-challenger-board.json
          if-no-files-found: error
          retention-days: 7
