name: Creative Studio safety tests
on:
  pull_request:
    paths:
      - "src/lib/creative-offer.ts"
      - "src/routes/creative-studio.tsx"
      - "scripts/test-creative-offer.mjs"
      - ".github/workflows/creative-studio-tests.yml"
  push:
    paths:
      - "src/lib/creative-offer.ts"
      - "src/routes/creative-studio.tsx"
      - "scripts/test-creative-offer.mjs"
      - ".github/workflows/creative-studio-tests.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Creative Studio logic tests
        run: node --experimental-strip-types --test scripts/test-creative-offer.mjs

  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build full PrismBay application
        run: bun run build
