name: Cashflow Cloud CSV import validation

on:
  pull_request:
    paths:
      - "services/cashflow-cloud/**"
      - ".github/workflows/cashflow-cloud-import-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Cashflow Cloud CSV import
        run: node --test services/cashflow-cloud/invoice-import.test.mjs