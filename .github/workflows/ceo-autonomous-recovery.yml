name: PrismBay CEO Autonomous Recovery Loop

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/autonomous-growth-system.json'
      - 'config/strict-kpis.json'
      - 'config/conversion-event-contract.json'
      - 'config/prelaunch-commercialization-policy.json'
      - 'config/commercial-tournament-policy.json'
      - 'config/commercial-resilience-policy.json'
      - 'scripts/ceo-autonomous-growth-engine.mjs'
      - 'scripts/autonomous-company-task-allocator.mjs'
      - 'scripts/prelaunch-commercialization-factory.mjs'
      - 'scripts/ceo-commercial-tournament.mjs'
      - 'scripts/decision-evidence-priority.mjs'
      - 'scripts/commercial-resilience-engine.mjs'
      - 'scripts/commercial-resilience-engine.test.mjs'
      - 'scripts/commercial-resilience-orchestrator.mjs'
      - 'scripts/commercial-resilience-orchestrator.test.mjs'
      - 'scripts/commercial-resilience-task-bridge.mjs'
      - 'scripts/commercial-resilience-task-bridge.test.mjs'
      - 'scripts/inventory-depth-guard.mjs'
      - 'scripts/inventory-depth-guard.test.mjs'
      - 'scripts/offer-floor-enrichment.mjs'
      - 'scripts/offer-floor-enrichment.test.mjs'
      - 'scripts/runtime-commercial-signal-collector.mjs'
      - 'scripts/runtime-commercial-signal-collector.test.mjs'
      - 'scripts/attention-guided-supplier-catalog.mjs'
      - 'scripts/attention-guided-supplier-catalog.test.mjs'
      - 'scripts/attention-guided-cj-pass.mjs'
      - 'scripts/supplier-challenger-worker.mjs'
      - 'growth-reports/supplier-challenger-board.json'
      - '.github/workflows/ceo-autonomous-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/autonomous-growth-system.json'
      - 'config/strict-kpis.json'
      - 'config/conversion-event-contract.json'
      - 'config/prelaunch-commercialization-policy.json'
      - 'config/commercial-tournament-policy.json'
      - 'config/commercial-resilience-policy.json'
      - 'scripts/ceo-autonomous-growth-engine.mjs'
      - 'scripts/autonomous-company-task-allocator.mjs'
      - 'scripts/prelaunch-commercialization-factory.mjs'
      - 'scripts/ceo-commercial-tournament.mjs'
      - 'scripts/decision-evidence-priority.mjs'
      - 'scripts/commercial-resilience-engine.mjs'
      - 'scripts/commercial-resilience-engine.test.mjs'
      - 'scripts/commercial-resilience-orchestrator.mjs'
      - 'scripts/commercial-resilience-orchestrator.test.mjs'
      - 'scripts/commercial-resilience-task-bridge.mjs'
      - 'scripts/commercial-resilience-task-bridge.test.mjs'
      - 'scripts/inventory-depth-guard.mjs'
      - 'scripts/inventory-depth-guard.test.mjs'
      - 'scripts/offer-floor-enrichment.mjs'
      - 'scripts/offer-floor-enrichment.test.mjs'
      - 'scripts/runtime-commercial-signal-collector.mjs'
      - 'scripts/runtime-commercial-signal-collector.test.mjs'
      - 'scripts/attention-guided-supplier-catalog.mjs'
      - 'scripts/attention-guided-supplier-catalog.test.mjs'
      - 'scripts/attention-guided-cj-pass.mjs'
      - 'scripts/supplier-challenger-worker.mjs'
      - '.github/workflows/ceo-autonomous-recovery.yml'

permissions:
  contents: read

concurrency:
  group: prismbay-ceo-autonomous-recovery
  cancel-in-progress: true

jobs:
  recover-and-reallocate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate recovery and commercial resilience engines
        run: |
          test -s config/autonomous-growth-system.json
          test -s config/conversion-event-contract.json
          test -s config/prelaunch-commercialization-policy.json
          test -s config/commercial-tournament-policy.json
          test -s config/commercial-resilience-policy.json
          node --test \
            scripts/ceo-autonomous-growth-engine.test.mjs \
            scripts/autonomous-company-task-allocator.test.mjs \
            scripts/prelaunch-commercialization-factory.test.mjs \
            scripts/ceo-commercial-tournament.test.mjs \
            scripts/decision-evidence-priority.test.mjs \
            scripts/commercial-resilience-engine.test.mjs \
            scripts/commercial-resilience-orchestrator.test.mjs \
            scripts/commercial-resilience-task-bridge.test.mjs \
            scripts/inventory-depth-guard.test.mjs \
            scripts/offer-floor-enrichment.test.mjs \
            scripts/runtime-commercial-signal-collector.test.mjs \
            scripts/attention-guided-supplier-catalog.test.mjs \
            scripts/supplier-challenger-worker.test.mjs

      - name: Rebuild commercial evidence needed for autonomous decisions
        run: |
          node scripts/global-commerce-opportunity-engine.mjs
          node scripts/retail-promotion-swarm.mjs
          node scripts/tiktok-retail-readiness.mjs
          node scripts/first-sale-verifier.mjs
          node scripts/paperclip-revenue-bridge.mjs
          node scripts/prioritize-commercial-candidates.mjs
          node scripts/paperclip-sales-strategy-engine.mjs
          node scripts/paperclip-commerce-group.mjs
          node scripts/paperclip-no-idle-guard.mjs
          node scripts/strict-kpi-scorecard.mjs

      - name: Refresh read-only supplier portfolio on production cycles
        if: github.event_name != 'pull_request'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          if [ -n "$CJ_API_KEY" ]; then
            node scripts/paperclip-cj-sourcing.mjs
          else
            echo 'CJ_API_KEY unavailable; resilience engine will fail closed on supplier-route evidence.'
          fi

      - name: Collect privacy-safe runtime checkout failures when configured
        if: github.event_name != 'pull_request'
        env:
          COMMERCIAL_SIGNAL_URL: ${{ secrets.COMMERCIAL_SIGNAL_URL }}
          COMMERCIAL_SIGNAL_READ_TOKEN: ${{ secrets.COMMERCIAL_SIGNAL_READ_TOKEN }}
        run: node scripts/runtime-commercial-signal-collector.mjs

      - name: Detect deadlocks, evidence debt and recovery routes
        run: node scripts/ceo-autonomous-growth-engine.mjs

      - name: Allocate quantified work to all ten companies
        run: node scripts/autonomous-company-task-allocator.mjs

      - name: Build supplier resilience, price tournament and checkout recovery
        run: node scripts/commercial-resilience-orchestrator.mjs

      - name: Add threshold-crossing offer hypotheses
        run: node scripts/offer-floor-enrichment.mjs

      - name: Enforce inventory depth and fragile-route recovery
        run: node scripts/inventory-depth-guard.mjs

      - name: Inject resilience work into the ten-company taskboard
        run: node scripts/commercial-resilience-task-bridge.mjs

      - name: Build synchronized prelaunch commercialization kits
        run: node scripts/prelaunch-commercialization-factory.mjs

      - name: Run commercial tournament and reallocate internal attention
        run: node scripts/ceo-commercial-tournament.mjs

      - name: Build attention-guided supplier catalog
        run: node scripts/attention-guided-supplier-catalog.mjs

      - name: Run focused supplier pass for current tournament leaders
        if: github.event_name != 'pull_request'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          if [ -n "$CJ_API_KEY" ]; then
            node scripts/attention-guided-cj-pass.mjs
          else
            echo 'CJ_API_KEY unavailable; focused supplier pass skipped without fabricating evidence.'
          fi

      - name: Recompute resilience after focused supplier pass
        if: github.event_name != 'pull_request'
        run: |
          node scripts/commercial-resilience-orchestrator.mjs
          node scripts/offer-floor-enrichment.mjs
          node scripts/inventory-depth-guard.mjs
          node scripts/commercial-resilience-task-bridge.mjs
          node scripts/ceo-commercial-tournament.mjs

      - name: Rank evidence by commercial decision leverage
        run: node scripts/decision-evidence-priority.mjs

      - name: Retain autonomous recovery and commercial resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-ceo-recovery-${{ github.run_id }}
          path: |
            growth-reports/ceo-autonomous-growth-board.json
            growth-reports/evidence-debt-ledger.json
            growth-reports/autonomous-company-taskboard.json
            growth-reports/strict-kpi-scorecard.json
            growth-reports/prismbay-commerce-group-dashboard.json
            growth-reports/prelaunch-commercialization.json
            growth-reports/prelaunch-kits/*.json
            growth-reports/ceo-commercial-tournament.json
            growth-reports/commercial-hypothesis-ledger.json
            growth-reports/decision-evidence-priority.json
            growth-reports/supplier-route-promotion-board.json
            growth-reports/offer-price-tournament.json
            growth-reports/checkout-recovery-board.json
            growth-reports/checkout-failure-evidence.json
            growth-reports/inventory-depth-board.json
            growth-reports/attention-guided-supplier-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: CEO recovery, resilience and tournament summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const r=(p,fallback={})=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return fallback}};
          const g=r('growth-reports/ceo-autonomous-growth-board.json');
          const t=r('growth-reports/autonomous-company-taskboard.json');
          const p=r('growth-reports/prelaunch-commercialization.json');
          const c=r('growth-reports/ceo-commercial-tournament.json');
          const e=r('growth-reports/decision-evidence-priority.json');
          const s=r('growth-reports/supplier-route-promotion-board.json');
          const o=r('growth-reports/offer-price-tournament.json');
          const x=r('growth-reports/checkout-recovery-board.json');
          const f=r('growth-reports/checkout-failure-evidence.json',{eventCount:0});
          const i=r('growth-reports/inventory-depth-board.json');
          const a=r('growth-reports/attention-guided-supplier-candidates.json',{leaders:[]});
          console.log('## PrismBay CEO Autonomous Recovery');
          console.log(`- Verified sales: ${g.verifiedSales}`);
          console.log(`- CEO priority: ${g.ceoPriority}`);
          console.log(`- Recovery sprints: ${g.recoverySprints.length}`);
          console.log(`- Evidence debt: ${g.evidenceDebtCount}`);
          console.log(`- Product race: ${g.productRaceCount}`);
          console.log(`- Quantified tasks: ${t.totalTasks} across ${t.activeCompanies} companies`);
          console.log(`- Prelaunch kits synchronized: ${p.kitCount}`);
          console.log('');
          console.log('## Commercial Resilience');
          console.log(`- Supplier route-promotion proposals: ${s.routePromotionProposals.length}`);
          console.log(`- High/critical supplier-concentration products: ${s.highRiskProducts.length}`);
          console.log(`- Challenger evidence merged: ${Boolean(s.challengerBoardCheckedAt)}`);
          console.log(`- Fragile inventory products: ${i.fragileProductCount}`);
          console.log(`- Price/bundle hypotheses: ${o.hypothesisCount}`);
          console.log(`- Threshold-crossing price hypotheses added: ${o.thresholdCrossingHypothesesAdded || 0}`);
          console.log(`- Sanitized runtime failure events ingested: ${f.eventCount || 0}`);
          console.log(`- Checkout failure recovery tasks: ${x.tasks.length}`);
          console.log(`- Attention-guided supplier leaders: ${(a.leaders || []).join(', ') || 'none'}`);
          console.log('- Route proposals never auto-order inventory or bypass final-ZIP checkout gates.');
          console.log('- Low stock triggers backup work but does not falsely mark a valid one-unit route unavailable.');
          console.log('- Price hypotheses never change live pricing automatically; elasticity requires measured conversion evidence.');
          console.log('');
          console.log('## Commercial Tournament');
          console.log(`- Top product for internal attention: ${c.productTournament[0]?.slug || 'none'}`);
          console.log(`- Products competing: ${c.productTournament.length}`);
          console.log(`- Strategies competing: ${c.strategyTournament.length}`);
          console.log(`- Open measurable hypotheses: ${c.hypothesisLedger.length}`);
          console.log(`- Highest-leverage evidence: ${e.immediateTopFive[0]?.evidence || 'none'} for ${e.immediateTopFive[0]?.subject || 'none'}`);
          NODE
