name: PrismBay capacity versus cash Short private review
on:
  push:
    paths:
      - youtube-growth/production/render_capacity_cash_short.py
      - .github/workflows/prismbay-capacity-cash-short-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-cost local media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow piper-tts
      - name: Render original 1080x1920 Short with local voice
        run: |
          python youtube-growth/production/render_capacity_cash_short.py
      - name: Independent arithmetic, caption, media and rights preflight
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('out/youtube/capacity-cash-short')
          m=json.loads((root/'manifest.json').read_text())
          assert m['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert m['brandId']=='6945443'
          assert m['episodeId']=='PB-YT-SH-2026-11-01-CAPACITY-CASH'
          assert m['publicationApproved'] is False and m['uploadPermitted'] is False
          assert m['reviewOnly'] is True and m['paidSpendUSD']==0
          assert m['narrationSegments']==12 and m['sceneCount']==7
          assert m['voice']=='en_US-norman-medium'
          assert m['voiceRightsReview']['status']=='SOURCE_REVIEWED_NOT_LEGAL_OPINION'
          assert m['fictionalExample'] is True
          a=m['hypotheticalScenario']
          assert a['capacityValueUSD']==a['releasedHours']*a['laborRateUSDPerHour']==3600
          assert a['cashSpendingChangeWithoutOtherChangesUSD']==400
          assert a['netCashReductionInAlternativeUSDPerMonth']==a['alternativeOvertimeReductionUSDPerMonth']-a['softwareCostUSDPerMonth']==600
          assert a['initialPayrollChangeUSD']==0
          assert 'Alternative scenarios' in a['note']
          safe=m['mobileSafeArea']
          assert safe['criticalTextMaxX']<=900 and safe['captionBoxBottomY']<1600
          video=root/m['videoFilename']
          assert video.is_file()
          assert hashlib.sha256(video.read_bytes()).hexdigest()==m['videoSha256']
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-xerror','-i',str(video),'-f','null','-'],check=True)
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,width,height','-of','json',str(video)]))
          assert 30<float(probe['format']['duration'])<100
          assert any(s.get('width')==1080 and s.get('height')==1920 for s in probe['streams'])
          assert any(s.get('codec_type')=='audio' for s in probe['streams'])
          assert abs(float(probe['format']['duration'])-m['durationSeconds'])<0.01
          srt=(root/'captions-phrase-synchronous.srt').read_text()
          assert srt.count(' --> ')==12
          spec=importlib.util.spec_from_file_location('episode','youtube-growth/production/render_capacity_cash_short.py')
          ep=importlib.util.module_from_spec(spec);spec.loader.exec_module(ep)
          blocks=srt.strip().split('\n\n')
          assert [' '.join(b.splitlines()[2:]) for b in blocks]==[p[1] for p in ep.PHRASES]
          def secs(s):
            h,mi,rest=s.split(':'); ss,ms=rest.split(',')
            return int(h)*3600+int(mi)*60+int(ss)+int(ms)/1000
          times=[]
          for block in blocks:
            lines=block.splitlines()
            start,end=map(secs,lines[1].split(' --> '))
            assert start<end
            assert 60*len(' '.join(lines[2:]).split())/(end-start)<=160.1
            times.append((start,end))
          assert abs(times[-1][1]-float(probe['format']['duration']))<0.35
          stderr=subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(video),'-vn','-af','silencedetect=noise=-45dB:d=1.25','-f','null','-'],capture_output=True,text=True,check=True).stderr
          assert 'silence_start:' not in stderr
          review=root/'release-review-pack';review.mkdir(exist_ok=True)
          frames=[]
          for i,(start,end) in enumerate(times):
            path=review/f'frame-{i+1:02d}.png'
            subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{(start+end)/2:.3f}','-i',str(video),'-frames:v','1','-vf','scale=324:576:flags=lanczos',str(path)],check=True)
            frames.append(path)
          assert len(set(hashlib.sha256(p.read_bytes()).hexdigest() for p in frames))==12
          sheet=Image.new('RGB',(1386,1926),'#eaf0f4');d=ImageDraw.Draw(sheet)
          for i,path in enumerate(frames):
            x=18+(i%4)*342;y=18+(i//4)*636
            d.text((x,y),f'CAPTION {i+1:02d}',fill='#10293b')
            sheet.paste(Image.open(path).convert('RGB'),(x,y+35))
          sheet.save(review/'twelve-frames.png',optimize=True)
          (review/'release-status.json').write_text(json.dumps({
            'episode':m['episodeId'],'channel':m['channelId'],
            'frameCount':12,'captionsMatched':True,'audioSilencePass':True,
            'publicationApproved':False,'uploadPermitted':False,
            'outstanding':['Independent full narration listening','Real-device playback','Final editorial approval']
          },indent=2)+'\n')
          print('Independent technical QA passed. Public upload NOT authorized.')
          PY
      - name: Retain unpublished media and evidence for seven days
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-capacity-cash-short-private-review
          path: |
            out/youtube/capacity-cash-short/prismbay-ai-capacity-vs-cash-short-review.mp4
            out/youtube/capacity-cash-short/captions-phrase-synchronous.srt
            out/youtube/capacity-cash-short/manifest.json
            out/youtube/capacity-cash-short/release-review-pack/*.png
            out/youtube/capacity-cash-short/release-review-pack/*.json
          retention-days: 7
