name: PrismBay AI Unit Economics Short Draft

on:
  push:
    branches: [main]
    paths:
      - 'scripts/youtube_visual_unit_economics.py'
      - 'scripts/render-unit-economics-draft.py'
      - 'scripts/validate-unit-economics-scenes.py'
      - 'scripts/build-unit-economics-captions.py'
      - 'content/youtube/special-requests/ai-cost-per-accepted-result-2026-10-27.json'
      - '.github/workflows/prismbay-unit-economics-short.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prismbay-unit-economics-draft-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout sole authorized channel production repository
        uses: actions/checkout@v4

      - name: Install free production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input pillow
          python3 -m pip install --disable-pip-version-check --no-input piper-tts || true

      - name: Validate original visual treatment
        run: |
          python3 scripts/validate-unit-economics-scenes.py content/youtube/special-requests/ai-cost-per-accepted-result-2026-10-27.json

      - name: Render original unpublished draft
        run: |
          python3 scripts/render-unit-economics-draft.py content/youtube/special-requests/ai-cost-per-accepted-result-2026-10-27.json

      - name: Normalize narration audio and preserve strict release gate
        run: |
          set -euo pipefail
          slug='ai-cost-per-accepted-result-2026-10-27'
          original="public/youtube/$slug.mp4"
          temp="public/youtube/$slug.audio-master.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$original" \
            -map 0:v:0 -map 0:a:0 -c:v copy \
            -af 'loudnorm=I=-16:TP=-1.5:LRA=11' \
            -c:a aac -b:a 160k -ar 44100 -movflags +faststart "$temp"
          mv "$temp" "$original"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          slug='ai-cost-per-accepted-result-2026-10-27'
          p=Path('public/youtube')/(slug+'.mp4')
          m=p.with_suffix('.json')
          manifest=json.loads(m.read_text())
          assert manifest['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert manifest['publicationApproved'] is False
          assert manifest['paidSpendUSD']==0
          manifest['sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest['audioMastered']=True
          manifest['captionTimingVerified']=False
          manifest['manualNarrationReview']=False
          manifest['qualityGate']='CLOSED_PENDING_FULL_AUDIO_VISUAL_CAPTION_QA'
          m.write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Generate scene-aligned provisional captions, never auto-approve
        run: |
          python3 scripts/build-unit-economics-captions.py \
            content/youtube/special-requests/ai-cost-per-accepted-result-2026-10-27.json \
            public/youtube/ai-cost-per-accepted-result-2026-10-27.mp4 \
            --output public/youtube/ai-cost-per-accepted-result-2026-10-27.srt

      - name: Technical media and release-gate checks
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          slug='ai-cost-per-accepted-result-2026-10-27'
          p=Path('public/youtube')/(slug+'.mp4')
          m=json.loads((p.with_suffix('.json')).read_text())
          assert p.exists() and p.stat().st_size>100000
          assert m['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert m['publicationApproved'] is False and m['paidSpendUSD']==0
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert m.get('audioMastered') is True
          assert m.get('captionTimingVerified') is False
          assert m.get('manualNarrationReview') is False
          subtitle=p.with_suffix('.srt')
          report=p.with_suffix('.caption_qa.json')
          assert subtitle.exists() and subtitle.stat().st_size>500
          caption_report=json.loads(report.read_text())
          assert caption_report['cueCount']>=25
          assert caption_report['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert caption_report['publicationApproved'] is False
          assert caption_report['timingStatus']=='PROVISIONAL_REQUIRES_FULL_AUDIO_LISTENING'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          video=next(x for x in info['streams'] if x['codec_type']=='video')
          audio=next(x for x in info['streams'] if x['codec_type']=='audio')
          assert (video['width'],video['height'])==(1080,1920)
          seconds=float(info['format']['duration'])
          assert 35<seconds<95,seconds
          print('Technical QA passed. Duration:',round(seconds,2),'seconds. Audio codec:',audio['codec_name'])
          print('PUBLICATION BLOCKED pending full audiovisual and captions QA.')
          PY

      - name: Reject black frames and black flashes before QA handoff
        run: |
          python3 - <<'PY'
          import re, subprocess
          video='public/youtube/ai-cost-per-accepted-result-2026-10-27.mp4'
          cmd=['ffmpeg','-hide_banner','-nostats','-i',video,
               '-vf','blackdetect=d=0.025:pix_th=0.05','-an','-f','null','-']
          result=subprocess.run(cmd,text=True,capture_output=True)
          if result.returncode:
              raise RuntimeError('Frame integrity scan failed: '+result.stderr[-1200:])
          flashes=re.findall(r'black_start:([0-9.]+)',result.stderr)
          if flashes:
              raise RuntimeError('Black-frame retention defect at seconds: '+', '.join(flashes))
          print('No black flashes detected. Publication approval remains false.')
          PY

      - name: Preserve draft for independent QA, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-ai-unit-economics-qa-draft
          path: |
            public/youtube/ai-cost-per-accepted-result-2026-10-27.mp4
            public/youtube/ai-cost-per-accepted-result-2026-10-27.json
            public/youtube/ai-cost-per-accepted-result-2026-10-27.srt
            public/youtube/ai-cost-per-accepted-result-2026-10-27.caption_qa.json
            .youtube-render/ai-cost-per-accepted-result-2026-10-27/*.png
          retention-days: 7
