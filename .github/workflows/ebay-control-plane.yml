name: PrismBay eBay Control Plane

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ebay-control-plane.mjs'
      - 'scripts/ebay-control-plane-blocked.test.mjs'
      - 'scripts/ebay-pages-single-writer.test.mjs'
      - 'scripts/ebay-draft-feed.mjs'
      - 'scripts/ebay-draft-feed.test.mjs'
      - 'marketplaces/ebay/garment-steamer.json'
      - 'marketplaces/ebay/seller-packet.html'
      - '.github/workflows/ebay-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ebay-control-plane.mjs'
      - 'scripts/ebay-control-plane-blocked.test.mjs'
      - 'scripts/ebay-draft-feed.mjs'
      - 'scripts/ebay-draft-feed.test.mjs'
      - 'marketplaces/ebay/garment-steamer.json'
      - 'marketplaces/ebay/seller-packet.html'
      - '.github/workflows/ebay-control-plane.yml'

permissions:
  contents: write

concurrency:
  group: prismbay-ebay-cj-api
  cancel-in-progress: false

jobs:
  verify-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and draft fallback
        run: |
          node --check scripts/ebay-control-plane.mjs
          node --check scripts/ebay-draft-feed.mjs
          node --test scripts/ebay-draft-feed.test.mjs scripts/ebay-control-plane-blocked.test.mjs scripts/ebay-pages-single-writer.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('marketplaces/ebay/garment-steamer.json','utf8'))"
      - name: Generate eBay draft and manual-entry packets
        run: node scripts/ebay-draft-feed.mjs
      - name: Discover CJ eBay authorization and dispatch location
        if: github.event_name != 'pull_request'
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: node scripts/ebay-control-plane.mjs
      - name: Publish sanitized marketplace state and draft fallback
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          syncdir="$RUNNER_TEMP/prismbay-ebay-pages"
          git fetch origin gh-pages
          git worktree add --detach "$syncdir" origin/gh-pages
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only this workflow owns marketplace/ebay/control-plane.json.
          # Reset to the latest remote state and replay ONLY our files on each
          # retry; rebasing a timestamped report causes avoidable conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git -C "$syncdir" reset --hard origin/gh-pages
            mkdir -p "$syncdir/marketplace/ebay"
            cp growth-reports/ebay/control-plane.json "$syncdir/marketplace/ebay/control-plane.json"
            cp growth-reports/ebay/garment-steamer-ebay-draft.csv "$syncdir/marketplace/ebay/garment-steamer-ebay-draft.csv"
            cp growth-reports/ebay/garment-steamer-manual-packet.csv "$syncdir/marketplace/ebay/garment-steamer-manual-packet.csv"
            cp growth-reports/ebay/garment-steamer-draft-readme.txt "$syncdir/marketplace/ebay/garment-steamer-draft-readme.txt"
            cp marketplaces/ebay/garment-steamer.json "$syncdir/marketplace/ebay/garment-steamer.json"
            cp marketplaces/ebay/seller-packet.html "$syncdir/marketplace/ebay/index.html"
            git -C "$syncdir" add marketplace/ebay/control-plane.json marketplace/ebay/garment-steamer-ebay-draft.csv marketplace/ebay/garment-steamer-manual-packet.csv marketplace/ebay/garment-steamer-draft-readme.txt marketplace/ebay/garment-steamer.json marketplace/ebay/index.html
            if git -C "$syncdir" diff --cached --quiet; then
              echo 'eBay marketplace files unchanged.'
              exit 0
            fi
            git -C "$syncdir" commit -m 'chore: publish verified eBay control-plane state'
            if git -C "$syncdir" push origin HEAD:gh-pages; then
              echo 'eBay marketplace state published without force pushing.'
              exit 0
            fi
            if [[ "$attempt" != "5" ]]; then sleep "$((attempt * 2))"; fi
          done
          echo '::error::eBay marketplace publish failed after replaying fresh gh-pages state.'
          exit 1
      - name: Summary
        if: always()
        run: |
          echo '## PrismBay eBay Control Plane' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks CJ shop authorization, pinned garment-steamer stock, exact dispatch-location evidence, and draft-feed validity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishes a zero-cost seller console plus official-minimum eBay draft CSV and manual-entry packet to GitHub Pages.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The draft feed does not publish a live listing. Final listing remains blocked until authorization and dispatch-location gates are green.' >> "$GITHUB_STEP_SUMMARY"
