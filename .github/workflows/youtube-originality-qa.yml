name: PrismBay YouTube Originality QA

on:
  push:
    branches: [main]
    paths:
      - 'content/youtube/qa-requests/*.json'
      - '.github/workflows/youtube-originality-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prismbay-youtube-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install open-source media inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Attenuate any detected near-clipping audio before final QA
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, hashlib, subprocess
          from pathlib import Path
          for req in sorted(glob.glob('content/youtube/qa-requests/*.json')):
              slug=json.loads(Path(req).read_text())['slug']
              src=Path('public/youtube')/(slug+'.mp4')
              meta=Path('public/youtube')/(slug+'.json')
              report=Path('editorial/youtube/qa')/slug/'technical_report.json'
              if not src.exists() or not meta.exists() or not report.exists():
                  continue
              q=json.loads(report.read_text())
              if q.get('technicalChecks',{}).get('noDigitalClipping') is not False:
                  continue
              tmp=src.with_name(slug+'.mastering-tmp.mp4')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),'-c:v','copy','-af','volume=-3dB','-c:a','aac','-b:a','160k','-movflags','+faststart',str(tmp)],check=True)
              tmp.replace(src)
              md=json.loads(meta.read_text())
              md['sha256']=hashlib.sha256(src.read_bytes()).hexdigest()
              md['audioMastering']='-3dB attenuation after near-clipping QA detection'
              meta.write_text(json.dumps(md,indent=2)+'\n')
              report.unlink()
              print('Mastered and queued for renewed QA:',slug)
          PY
      - name: Audit video and generate preview evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, re
          from pathlib import Path
          for req in sorted(glob.glob('content/youtube/qa-requests/*.json')):
              spec=json.loads(Path(req).read_text())
              slug=spec['slug']
              src=Path('public/youtube')/(slug+'.mp4')
              meta=Path('public/youtube')/(slug+'.json')
              dest=Path('editorial/youtube/qa')/slug
              if (dest/'technical_report.json').exists():
                  print('Preserving completed QA',slug)
                  continue
              if not src.exists() or not meta.exists():
                  print('Awaiting media',slug)
                  continue
              dest.mkdir(parents=True,exist_ok=True)
              info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(src)],text=True))
              streams=info['streams']
              video=next((s for s in streams if s['codec_type']=='video'),{})
              audio=next((s for s in streams if s['codec_type']=='audio'),{})
              dur=float(info['format'].get('duration',0))
              md=json.loads(meta.read_text())
              frames=[]
              for i,pct in enumerate((0.12,0.35,0.62,0.88),1):
                  target=dest/f'preview_{i:02d}.jpg'
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(round(dur*pct,3)),'-i',str(src),'-frames:v','1','-vf','scale=360:640','-q:v','3',str(target)],check=True)
                  frames.append(str(target))
              v=subprocess.run(['ffmpeg','-hide_banner','-i',str(src),'-af','volumedetect','-vn','-f','null','-'],capture_output=True,text=True)
              mean=re.search(r'mean_volume:\s*(-?[0-9.]+) dB',v.stderr)
              peak=re.search(r'max_volume:\s*(-?[0-9.]+) dB',v.stderr)
              duration_ok=18<=dur<=60
              dimensions_ok=video.get('width')==1080 and video.get('height')==1920
              codec_ok=video.get('codec_name')=='h264' and audio.get('codec_name')=='aac'
              piper_only=md.get('ttsEngines')==['piper']
              peak_db=float(peak.group(1)) if peak else None
              no_clipping=peak_db is not None and peak_db<=-0.1
              report={'slug':slug,'channelId':md.get('channelId'),'durationSeconds':dur,'videoCodec':video.get('codec_name'),'audioCodec':audio.get('codec_name'),'width':video.get('width'),'height':video.get('height'),'audioMeanDb':float(mean.group(1)) if mean else None,'audioPeakDb':peak_db,'ttsEngines':md.get('ttsEngines'),'originalVisualsDeclared':md.get('originalProgrammaticVisuals'),'previewFrames':frames,'technicalChecks':{'duration':duration_ok,'dimensions':dimensions_ok,'codecs':codec_ok,'piperVoice':piper_only,'noDigitalClipping':no_clipping,'soleChannel':md.get('channelId')=='UCw2hs85TzIpdKwJtG-BSxzQ'},'technicalPass':all((duration_ok,dimensions_ok,codec_ok,piper_only,no_clipping,md.get('channelId')=='UCw2hs85TzIpdKwJtG-BSxzQ')),'manualVisualReview':'PENDING','manualNarrationReview':'PENDING','publicationApproved':False,'paidSpendUSD':0}
              (dest/'technical_report.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps(report,indent=2))
          PY
      - name: Machine-check narration against the approved original script
        shell: bash
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install -q --disable-pip-version-check faster-whisper
          .qa-venv/bin/python - <<'PY'
          import glob, json, re, difflib
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('tiny.en',device='cpu',compute_type='int8')
          def norm(x):
              return re.sub(r'[^a-z0-9 ]','',x.lower()).split()
          for req in sorted(glob.glob('content/youtube/qa-requests/*.json')):
              slug=json.loads(Path(req).read_text())['slug']
              src=Path('public/youtube')/(slug+'.mp4')
              report=Path('editorial/youtube/qa')/slug/'technical_report.json'
              script=Path('content/youtube/requests')/(slug+'.json')
              if not src.exists() or not report.exists() or not script.exists():
                  continue
              q=json.loads(report.read_text())
              if q.get('machineNarrationReview',{}).get('completed'):
                  continue
              approved=json.loads(script.read_text())
              expected=' '.join(x['spoken'] for x in approved['segments'])
              segments,info=model.transcribe(str(src),language='en',beam_size=5,vad_filter=True)
              heard=' '.join(x.text.strip() for x in segments)
              score=difflib.SequenceMatcher(None,norm(expected),norm(heard)).ratio()
              q['machineNarrationReview']={'completed':True,'model':'faster-whisper tiny.en CPU','scriptWordCount':len(norm(expected)),'transcribedWordCount':len(norm(heard)),'wordSequenceSimilarity':round(score,3),'intelligibilityProxyPass':score>=0.72,'transcript':heard,'humanListeningReview':'NOT PERFORMED'}
              q['publicationApproved']=bool(q.get('technicalPass') and score>=0.72 and q.get('manualVisualReview')=='PASS')
              report.write_text(json.dumps(q,indent=2)+'\n')
              print(slug,'narration similarity',round(score,3),'pass',score>=0.72)
          PY
      - name: Commit technical QA artifacts
        run: |
          git config user.name prismbay-ai-qa-bot
          git config user.email actions@users.noreply.github.com
          mkdir -p editorial/youtube/qa/
          git add editorial/youtube/qa/ public/youtube/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record PrismBay YouTube media technical QA evidence'
          git push origin HEAD:main
