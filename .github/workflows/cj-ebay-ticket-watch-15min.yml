name: PrismBay CJ eBay Reply Watch 15m

on:
  # The hourly watcher is the single scheduled owner. Keep this workflow as
  # a manual fallback without four redundant supplier API calls per hour.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prismbay-ebay-cj-api
  cancel-in-progress: false

jobs:
  watch-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate watcher
        run: node --check scripts/cj-ebay-ticket-watch.mjs
      - name: Check CJ ticket
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: node scripts/cj-ebay-ticket-watch.mjs
      - name: Publish sanitized reply status
        shell: bash
        run: |
          set -euo pipefail
          syncdir="$RUNNER_TEMP/prismbay-cj-watch-pages"
          git fetch origin gh-pages
          git worktree add --detach "$syncdir" origin/gh-pages
          git -C "$syncdir" config user.name 'github-actions[bot]'
          git -C "$syncdir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$syncdir/marketplace/ebay"
          cp growth-reports/ebay/cj-ticket-watch.json "$syncdir/marketplace/ebay/cj-ticket-watch.json"
          git -C "$syncdir" add marketplace/ebay/cj-ticket-watch.json
          if ! git -C "$syncdir" diff --cached --quiet; then
            git -C "$syncdir" commit -m 'chore: publish CJ eBay reply status'
            for attempt in 1 2 3; do
              git fetch origin gh-pages
              if ! git -C "$syncdir" rebase origin/gh-pages; then
                git -C "$syncdir" rebase --abort || true
                echo 'Concurrent page edit needs review. No forced push.' >&2
                exit 1
              fi
              if git -C "$syncdir" push origin HEAD:gh-pages; then
                echo 'CJ eBay reply status published.'
                exit 0
              fi
              echo "Publish attempt $attempt failed; retrying safely." >&2
              if [[ "$attempt" != "3" ]]; then sleep "$((attempt * 3))"; fi
            done
            echo 'CJ reply status publish failed after three attempts.' >&2
            exit 1
          fi
      - name: Retain CJ status report if publishing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cj-reply-${{ github.run_id }}
          path: growth-reports/ebay/cj-ticket-watch.json
          if-no-files-found: warn
          retention-days: 3
