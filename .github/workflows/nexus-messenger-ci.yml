name: Nexus Messenger release gates
on:
  push:
    branches:
      - feature/nexus-messenger-standalone-source
      - ci/nexus-full-release-gates
    paths:
      - 'apps/nexus-messenger/**'
      - '.github/workflows/nexus-messenger-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/nexus-messenger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser tests
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload compiled web app
        uses: actions/upload-artifact@v4
        with:
          name: nexus-messenger-web-build
          path: apps/nexus-messenger/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-messenger-browser-diagnostics
          path: |
            apps/nexus-messenger/test-results/
            apps/nexus-messenger/playwright-report/
          if-no-files-found: ignore
