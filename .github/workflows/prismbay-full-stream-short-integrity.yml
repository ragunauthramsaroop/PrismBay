name: PrismBay Full-Stream Short Integrity QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prismbay-full-stream-short-integrity.yml'
      - 'scripts/prismbay_full_stream_integrity_qa.py'
      - 'public/youtube/nist-agent-identity-revocation-2026-10-29.mp4'
      - 'public/youtube/ai-vendor-procurement-mobile-v2-2026-10-29.mp4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prismbay-full-stream-short-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout only the authorized PrismBay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install open-source media verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m py_compile scripts/prismbay_full_stream_integrity_qa.py
      - name: Decode every frame and audio sample of both unpublished Shorts
        shell: bash
        run: |
          set -euo pipefail
          for slug in nist-agent-identity-revocation-2026-10-29 ai-vendor-procurement-mobile-v2-2026-10-29; do
            python3 scripts/prismbay_full_stream_integrity_qa.py \
              --video "public/youtube/${slug}.mp4" \
              --manifest "public/youtube/${slug}.json" \
              --report "youtube-growth/analytics/full-stream-integrity/${slug}.json"
          done
      - name: Verify no QA report grants publishing authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=sorted(Path('youtube-growth/analytics/full-stream-integrity').glob('*.json'))
          assert len(paths)==2
          for path in paths:
              data=json.loads(path.read_text())
              assert data['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
              assert data['allVideoFramesDecoded'] is True
              assert data['allAudioDecoded'] is True
              assert data['published'] is False
              assert data['publicationApproved'] is False
              assert data['uploadPermitted'] is False
              assert data['paidSpendUSD']==0
              print(path, 'complete-stream decode passed; editorial release still closed')
          PY
      - name: Archive independent machine-only reports
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-full-stream-integrity-${{ github.run_id }}
          path: youtube-growth/analytics/full-stream-integrity/
          retention-days: 14
          if-no-files-found: error
      - name: Commit reports without publishing or scheduling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name prismbay-ai-qa-bot
          git config user.email actions@users.noreply.github.com
          git add youtube-growth/analytics/full-stream-integrity/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record unpublished full-stream integrity checks for two PrismBay Shorts'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Preserve publication hold
        if: always()
        run: |
          echo 'Only channel UCw2hs85TzIpdKwJtG-BSxzQ / @PrismBayAI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job does not publish, schedule, approve editorial QA or spend money.' >> "$GITHUB_STEP_SUMMARY"
