name: Paperclip Global Commerce CJ Sourcing

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'paperclip/prismbay-global-commerce/research/supplier-candidates.json'
      - 'scripts/candidate-rotation.mjs'
      - 'scripts/cj-match-policy.mjs'
      - 'scripts/cj-match-policy.test.mjs'
      - 'scripts/cj-freight-policy.mjs'
      - 'scripts/cj-freight-policy.test.mjs'
      - 'scripts/paperclip-cj-sourcing.mjs'
      - 'scripts/paperclip-cj-sourcing.test.mjs'
      - 'scripts/cj-variant-detail-enricher.mjs'
      - 'scripts/cj-variant-detail-enricher.test.mjs'
      - 'scripts/supplier-economics-stress-test.mjs'
      - 'scripts/supplier-economics-stress-test.test.mjs'
      - 'scripts/supplier-commercial-ranker.mjs'
      - 'scripts/supplier-commercial-ranker.test.mjs'
      - '.github/workflows/paperclip-cj-sourcing.yml'
  push:
    branches: [main]
    paths:
      - 'paperclip/prismbay-global-commerce/research/supplier-candidates.json'
      - 'scripts/candidate-rotation.mjs'
      - 'scripts/cj-match-policy.mjs'
      - 'scripts/cj-match-policy.test.mjs'
      - 'scripts/cj-freight-policy.mjs'
      - 'scripts/cj-freight-policy.test.mjs'
      - 'scripts/paperclip-cj-sourcing.mjs'
      - 'scripts/paperclip-cj-sourcing.test.mjs'
      - 'scripts/cj-variant-detail-enricher.mjs'
      - 'scripts/cj-variant-detail-enricher.test.mjs'
      - 'scripts/supplier-economics-stress-test.mjs'
      - 'scripts/supplier-economics-stress-test.test.mjs'
      - 'scripts/supplier-commercial-ranker.mjs'
      - 'scripts/supplier-commercial-ranker.test.mjs'
      - '.github/workflows/paperclip-cj-sourcing.yml'

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          node --test
          scripts/cj-match-policy.test.mjs
          scripts/cj-freight-policy.test.mjs
          scripts/paperclip-cj-sourcing.test.mjs
          scripts/cj-variant-detail-enricher.test.mjs
          scripts/supplier-economics-stress-test.test.mjs
          scripts/supplier-commercial-ranker.test.mjs

  source-products:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source all live-store products plus rotating adjacent opportunities through read-only CJ API
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          PAPERCLIP_CJ_BATCH_SIZE: '11'
          PAPERCLIP_CJ_ANCHOR_COUNT: '9'
        run: node scripts/paperclip-cj-sourcing.mjs
      - name: Capture exact selected variant attributes
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: node scripts/cj-variant-detail-enricher.mjs
      - name: Stress-test provisional landed economics
        run: node scripts/supplier-economics-stress-test.mjs
      - name: Re-rank candidates using verified commercial evidence
        run: node scripts/supplier-commercial-ranker.mjs
      - name: Retain supplier, variant and economics evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-cj-sourcing-${{ github.run_id }}
          path: |
            growth-reports/paperclip-cj-sourcing.json
            growth-reports/cj-variant-details.json
            growth-reports/supplier-economics-stress-test.json
            growth-reports/supplier-commercial-rank.json
          if-no-files-found: error
          retention-days: 14
