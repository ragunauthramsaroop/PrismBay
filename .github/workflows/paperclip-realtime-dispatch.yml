name: PrismBay Paperclip Real-Time Dispatcher

# The commerce control plane already runs every 15 minutes.
# Allow only manual requests and ONE trusted success event to request
# an extra run. Owner/bot issue comments and PR changes previously
# generated cascades of redundant queued/cancelled Actions.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Claude Free GitHub Cloud Agent'
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: prismbay-paperclip-realtime-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch only when commerce needs a run
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'paperclip-commerce-group.yml';
            const manual = context.eventName === 'workflow_dispatch';
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              branch: 'main',
              per_page: 25
            });
            const operational = result.data.workflow_runs.filter(run =>
              ['schedule','workflow_dispatch','push'].includes(run.event)
            );
            const latest = operational[0];
            const age = latest ? Date.now() - Date.parse(latest.created_at) : Infinity;
            if (!manual && latest && (
              latest.status !== 'completed' || age < 15 * 60 * 1000
            )) {
              core.notice('Commerce worker is active or ran within 15 minutes; skipped redundant dispatch.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: 'main'
            });
            core.notice(manual
              ? 'Owner-requested commerce audit dispatched.'
              : 'Trusted upstream work completed; commerce audit dispatched after cooldown.');
