name: PrismBay Digital Revenue CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/digital-conversion-campaign.mjs'
      - 'scripts/digital-conversion-campaign.test.mjs'
      - 'scripts/buyer-acquisition-worker.test.mjs'
      - 'scripts/owned-sales-page-worker.mjs'
      - 'scripts/first-sale-assessment.mjs'
      - 'scripts/first-sale-assessment.test.mjs'
      - 'scripts/revenue-evidence-gates.mjs'
      - 'scripts/revenue-evidence-gates.test.mjs'
      - 'scripts/sales-revenue-control.mjs'
      - 'scripts/owned-sales-page-worker.test.mjs'
      - 'scripts/freellm-sales-worker.mjs'
      - 'scripts/freellm-sales-worker.test.mjs'
      - 'scripts/sales-sitemap-sync.mjs'
      - 'scripts/sales-sitemap-sync.test.mjs'
      - 'scripts/revenue-health-check.mjs'
      - 'scripts/revenue-health-check.test.mjs'
      - 'scripts/whop-public-access-audit.mjs'
      - 'scripts/whop-public-access-audit.test.mjs'
      - 'scripts/whop-merchant-readiness.mjs'
      - 'scripts/whop-merchant-readiness.test.mjs'
      - 'scripts/whop-sales-readiness.mjs'
      - 'scripts/whop-sales-readiness.test.mjs'
      - 'scripts/whop-files-attach-bridge.mjs'
      - 'scripts/whop-files-attach-bridge.test.mjs'
      - 'scripts/whop-agency-forensic-audit.mjs'
      - 'scripts/whop-agency-forensic-audit.test.mjs'
      - '.github/workflows/digital-revenue-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/digital-conversion-campaign.mjs'
      - 'scripts/digital-conversion-campaign.test.mjs'
      - 'scripts/buyer-acquisition-worker.test.mjs'
      - 'scripts/owned-sales-page-worker.mjs'
      - 'scripts/first-sale-assessment.mjs'
      - 'scripts/first-sale-assessment.test.mjs'
      - 'scripts/revenue-evidence-gates.mjs'
      - 'scripts/revenue-evidence-gates.test.mjs'
      - 'scripts/sales-revenue-control.mjs'
      - 'scripts/owned-sales-page-worker.test.mjs'
      - 'scripts/freellm-sales-worker.mjs'
      - 'scripts/freellm-sales-worker.test.mjs'
      - 'scripts/sales-sitemap-sync.mjs'
      - 'scripts/sales-sitemap-sync.test.mjs'
      - 'scripts/revenue-health-check.mjs'
      - 'scripts/revenue-health-check.test.mjs'
      - 'scripts/whop-public-access-audit.mjs'
      - 'scripts/whop-public-access-audit.test.mjs'
      - 'scripts/whop-merchant-readiness.mjs'
      - 'scripts/whop-merchant-readiness.test.mjs'
      - 'scripts/whop-sales-readiness.mjs'
      - 'scripts/whop-sales-readiness.test.mjs'
      - 'scripts/whop-files-attach-bridge.mjs'
      - 'scripts/whop-files-attach-bridge.test.mjs'
      - 'scripts/whop-agency-forensic-audit.mjs'
      - 'scripts/whop-agency-forensic-audit.test.mjs'
      - '.github/workflows/digital-revenue-ci.yml'

permissions:
  contents: read

jobs:
  verify-digital-revenue-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run digital revenue tests
        run: node --test scripts/digital-conversion-campaign.test.mjs scripts/buyer-acquisition-worker.test.mjs scripts/freellm-sales-worker.test.mjs scripts/owned-sales-page-worker.test.mjs scripts/first-sale-assessment.test.mjs scripts/revenue-evidence-gates.test.mjs scripts/sales-sitemap-sync.test.mjs scripts/revenue-health-check.test.mjs scripts/whop-public-access-audit.test.mjs scripts/whop-merchant-readiness.test.mjs scripts/whop-sales-readiness.test.mjs scripts/whop-agency-forensic-audit.test.mjs scripts/whop-files-attach-bridge.test.mjs
      - name: Generate owned-search offer pages
        run: node scripts/owned-sales-page-worker.mjs "$RUNNER_TEMP/owned-sales-pages"
      - name: Verify bundle output
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/owned-sales-pages/executive-intelligence-bundle.html"
          grep -q 'PrismBay Executive Intelligence Bundle' "$RUNNER_TEMP/owned-sales-pages/executive-intelligence-bundle.html"
          grep -q '\$179' "$RUNNER_TEMP/owned-sales-pages/executive-intelligence-bundle.html"
          grep -q 'eVqfZi5Lo7pV31Ea4MgnK0t' "$RUNNER_TEMP/owned-sales-pages/executive-intelligence-bundle.html"
          test "$(find "$RUNNER_TEMP/owned-sales-pages" -maxdepth 1 -name '*.html' | wc -l)" -eq 7
          test -s "$RUNNER_TEMP/owned-sales-pages/board-briefing-readiness-checklist.html"

      - name: Whop anonymous file exposure probe (only after merge, read-only)
        if: github.event_name == 'push'
        env:
          PRISMBAY_WHOP_ANON_FILE_URL: ${{ secrets.PRISMBAY_WHOP_ANON_FILE_URL }}
        run: node scripts/whop-public-access-audit.mjs

      - name: Whop read-only merchant API audit (requires company-scoped key)
        if: github.event_name != 'pull_request'
        env:
          WHOP_COMPANY_API_KEY: ${{ secrets.WHOP_COMPANY_API_KEY }}
          WHOP_COMPANY_ID: ${{ vars.WHOP_COMPANY_ID }}
        run: node scripts/whop-merchant-readiness.mjs

      - name: Check Whop checkout and payout eligibility read-only
        if: github.event_name != 'pull_request'
        env:
          WHOP_COMPANY_API_KEY: ${{ secrets.WHOP_COMPANY_API_KEY }}
          WHOP_COMPANY_ID: ${{ vars.WHOP_COMPANY_ID }}
        run: node scripts/whop-sales-readiness.mjs
