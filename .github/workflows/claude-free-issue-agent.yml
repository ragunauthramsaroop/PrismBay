name: PrismBay Read-Only Free-Model Issue Advisory

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  run-claude:
    if: >-
      github.event.issue.pull_request == null &&
      (startsWith(github.event.issue.title, '[CLAUDE-CLOUD]') || startsWith(github.event.issue.title, '[AI-COUNCIL]')) &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/free-model-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare owner-approved task
        env:
          CLAUDE_TASK: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          umask 077
          if [[ "$ISSUE_TITLE" == "[AI-COUNCIL]"* ]]; then
            {
              printf '%s\n' "You are an independent free-model advisory reviewer, not Anthropic Claude."
              printf '%s\n' "Do the task independently. Challenge weak assumptions. Do not defer to ChatGPT."
              printf '%s\n' "Assess only supplied public evidence. No repository tools are available. State unverified facts and obey AGENTS.md and CLAUDE.md."
              printf '%s\n' "Return concise sections: Independent answer, Evidence, Risks or disagreements, Recommended next action."
              printf '\n%s\n' "TASK FROM CHATGPT:"
              printf '%s\n' "$CLAUDE_TASK"
            } > /tmp/claude-task.txt
          else
            printf '%s\n' "$CLAUDE_TASK" > /tmp/claude-task.txt
          fi

      - name: Verify existing bounded free-model transport
        run: node --test scripts/agency-agents-model-client.test.mjs

      - name: Run existing read-only OpenCode free-model transport
        run: |
          node scripts/claude-9router-auto.mjs \
            --chat-prompt-file=/tmp/claude-task.txt \
            --output-file=/tmp/claude-output.txt

      - name: Post Claude response
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = fs.readFileSync('/tmp/claude-output.txt', 'utf8').trim();
            if (result.length > 60000) result = result.slice(0, 60000) + '\n\n[Output truncated by GitHub comment limit.]';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Independent free-model advisory (not Anthropic Claude; no repository tool access):\n\n' + result
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Read-only free-model advisory failed. No report accepted. Workflow: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
