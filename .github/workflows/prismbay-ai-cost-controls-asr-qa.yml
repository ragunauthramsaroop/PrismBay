name: PrismBay AI Cost Controls Independent Speech QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prismbay-ai-cost-controls-asr-qa.yml'
      - 'youtube-growth/qa/asr_caption_alignment.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: prismbay-ai-cost-controls-speech-qa
  cancel-in-progress: false

jobs:
  independent-speech-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout existing PrismBay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install zero-cost local ASR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --no-input faster-whisper
      - name: Retrieve exact existing unpublished production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cost-controls-source"
          gh run download 40802160968 -R "$GITHUB_REPOSITORY" \
            -n prismbay-ai-cost-controls-unapproved-40802160968 \
            -D "$RUNNER_TEMP/cost-controls-source"
          video=$(find "$RUNNER_TEMP/cost-controls-source" -type f -name '*.mp4' -print -quit)
          test -n "$video"
          echo 'c8da6a5fa46bb1e7ea9dfd6abf82b55d44b80d7fc63fdf515db7362d58be6a72  '"$video" | sha256sum --check --status
          echo 'Verified exact previously reviewed MP4 SHA256.'
      - name: Independently compare spoken audio with caption boundaries
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cost-controls-source"
          video=$(find "$root" -type f -name '*.mp4' -print -quit)
          srt=$(find "$root" -type f -name '*.srt' -print -quit)
          manifest=$(find "$root" -type f -name 'manifest.json' -print -quit)
          test -n "$video" && test -n "$srt" && test -n "$manifest"
          python -m py_compile youtube-growth/qa/asr_caption_alignment.py
          python youtube-growth/qa/asr_caption_alignment.py \
            --video "$video" --srt "$srt" --manifest "$manifest" \
            --output "$RUNNER_TEMP/cost-controls-asr"
          mkdir -p youtube-growth/analytics/cost-controls-asr-qa
          cp "$RUNNER_TEMP/cost-controls-asr/"* youtube-growth/analytics/cost-controls-asr-qa/
      - name: Preserve review evidence without publishing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name prismbay-ai-speech-qa-bot
          git config user.email actions@users.noreply.github.com
          git add youtube-growth/analytics/cost-controls-asr-qa/
          if git diff --cached --quiet; then
            echo 'Identical QA evidence already committed.'
            exit 0
          fi
          git commit -m 'Record independent ASR and caption sync proxy for unpublished AI Cost Controls'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'ASR evidence committed. Release approval remains closed.'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Confirm publication stays prohibited
        if: always()
        run: |
          echo '## Independent speech QA, not upload approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact channel: UCw2hs85TzIpdKwJtG-BSxzQ.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ASR is an automated estimate. Full human listening, mobile preview and final editorial approval remain pending.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No YouTube upload, no Metricool post, no paid advertising.' >> "$GITHUB_STEP_SUMMARY"
