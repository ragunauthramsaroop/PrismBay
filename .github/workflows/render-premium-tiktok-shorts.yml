name: Render Premium TikTok Shorts

on:
  pull_request:
    branches: [main]
    paths:
      - 'video-studio/**'
      - '.github/workflows/render-premium-tiktok-shorts.yml'
  push:
    branches:
      - 'automation/premium-tiktok-rebuild'
    paths:
      - 'video-studio/**'
      - '.github/workflows/render-premium-tiktok-shorts.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install video studio
        working-directory: video-studio
        run: npm install --no-audit --no-fund

      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate original PrismBay sound bed
        working-directory: video-studio
        run: npm run soundtrack

      - name: Render three premium 1080x1920 shorts
        working-directory: video-studio
        run: npm run render:all

      - name: Validate video outputs
        working-directory: video-studio
        shell: bash
        run: |
          set -euo pipefail
          count=$(find out -name '*.mp4' -type f | wc -l)
          test "$count" -eq 3
          for file in out/*.mp4; do
            test -s "$file"
            echo "Inspecting $file"
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -show_entries format=duration \
              -of json "$file" > "$file.probe.json"
            cat "$file.probe.json"
            node - "$file.probe.json" <<'NODE'
          const fs = require('fs');
          const probe = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const stream = probe.streams?.[0];
          const duration = Number(probe.format?.duration);
          if (!stream) throw new Error('missing_video_stream');
          if (stream.codec_name !== 'h264') throw new Error(`unexpected_codec_${stream.codec_name}`);
          if (stream.width !== 1080 || stream.height !== 1920) throw new Error(`unexpected_dimensions_${stream.width}x${stream.height}`);
          if (stream.r_frame_rate !== '30/1') throw new Error(`unexpected_fps_${stream.r_frame_rate}`);
          if (!(duration >= 14.9 && duration <= 15.2)) throw new Error(`unexpected_duration_${duration}`);
          NODE
          done

      - name: Upload premium video previews
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-premium-tiktok-previews-${{ github.run_id }}
          path: video-studio/out/*.mp4
          retention-days: 14
          if-no-files-found: error
