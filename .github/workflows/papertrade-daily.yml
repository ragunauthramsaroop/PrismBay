name: Daily Gold-Only Paper Research (Read Only)

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/papertrade-daily.yml"]

permissions:
  contents: read

concurrency:
  group: gold-only-research-daily
  cancel-in-progress: false

jobs:
  gold-research:
    if: github.repository == 'ragunauthramsaroop/PrismBay'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated gold-only research branch
        uses: actions/checkout@v4
        with:
          ref: experiment/ai-paper-trading
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify gold-only paper model and no-lookahead replay
        run: node --test papertrade/dashboard/tests/*.test.cjs

      - name: Evaluate recorded XAU/USD gold chart with hypothetical fills
        run: |
          mkdir -p artifacts/gold-research
          node papertrade/dashboard/tests/production-replay-smoke.cjs | tee artifacts/gold-research/log.txt
          node - <<'JS'
          const fs=require('node:fs');
          const log=fs.readFileSync('artifacts/gold-research/log.txt','utf8');
          const match=log.match(/VERIFIED_GOLD_ONLY_REPLAY=(\{[^\r\n]+\})/);
          if(!match)throw Error('No verified gold-only replay report');
          const report=JSON.parse(match[1]);
          if(report.instrument!=='XAU/USD'||report.realOrders!==0||!Number.isFinite(report.virtualEquity))
            throw Error('Invalid paper-only gold report');
          fs.writeFileSync('artifacts/gold-research/report.json',JSON.stringify({
            ...report,runAt:new Date().toISOString(),
            researchStatus:'NOT_VALIDATED_FOR_LIVE_TRADING',
            limitations:['Indicative gold chart proxy','Hypothetical fills, fees, spread and slippage',
              'Market closed hours have no invented candles','No broker account or real orders']
          },null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Gold-only paper research\n\nXAU/USD indicative chart proxy, not broker fills.\n\n'+
            '| Gold paper metric | Observed simulation |\n|---|---|\n'+
            '| Virtual ending equity | $'+report.virtualEquity+' |\n'+
            '| Virtual P/L | $'+report.virtualProfit+' |\n'+
            '| Estimated trading fees | $'+report.estimatedFees+' |\n'+
            '| Simulated BUY / SELL | '+report.virtualBuys+' / '+report.virtualSells+' |\n'+
            '\nNo BTC, crypto, broker connection, or real orders.\n');
          JS

      - name: Upload dated read-only gold research report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-xau-only-research
          path: artifacts/gold-research/
          retention-days: 30
