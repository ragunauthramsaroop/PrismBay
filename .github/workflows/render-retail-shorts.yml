name: PrismBay Retail Short Render

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/legacy-live-catalog.json'
      - 'config/retail-promotions.json'
      - 'scripts/render-retail-shorts.py'
      - 'scripts/test_render_retail_shorts.py'
      - '.github/workflows/render-retail-shorts.yml'
  push:
    branches: [main]
    paths:
      - 'config/legacy-live-catalog.json'
      - 'config/retail-promotions.json'
      - 'scripts/render-retail-shorts.py'
      - '.github/workflows/render-retail-shorts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Compile-check renderer
        run: python -m py_compile scripts/render-retail-shorts.py

      - name: Test legacy media and commercial gates
        run: python -m unittest discover -s scripts -p 'test_render_retail_shorts.py'

      - name: Render only independently cleared retail shorts
        run: python scripts/render-retail-shorts.py

      - name: Verify legacy candidates produced no product ads
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('build/retail-shorts/manifest.json').read_text())
          assert m['products'] == [], 'Unverified legacy products must not render'
          assert m['blockedUnverifiedCount'] == 4, m
          assert not list(Path('build/retail-shorts').rglob('*.mp4')), 'Unverified product video emitted'
          assert not list(Path('build/retail-shorts').rglob('*.png')), 'Unverified product card emitted'
          print('Four legacy products blocked; no unverified product creative produced')
          PY

      - name: Upload retail short package
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-retail-shorts-${{ github.run_id }}
          path: build/retail-shorts/
          if-no-files-found: error
          retention-days: 14
