name: PrismBay Physical Order Contact Automation CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/physical-orders/contact-vault.mjs'
      - 'services/physical-orders/contact-vault.test.mjs'
      - 'services/physical-orders/automation-bridge.mjs'
      - 'services/physical-orders/automation-bridge.test.mjs'
      - 'services/physical-orders/server.mjs'
      - 'scripts/commerce-automation-runtime.mjs'
      - 'scripts/commerce-job-file-store.mjs'
      - 'docs/PHYSICAL_ORDER_CONTACT_AUTOMATION.md'
      - '.github/workflows/physical-order-contact-automation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/physical-orders/contact-vault.mjs'
      - 'services/physical-orders/contact-vault.test.mjs'
      - 'services/physical-orders/automation-bridge.mjs'
      - 'services/physical-orders/automation-bridge.test.mjs'
      - 'services/physical-orders/server.mjs'
      - 'scripts/commerce-automation-runtime.mjs'
      - 'scripts/commerce-job-file-store.mjs'
      - 'docs/PHYSICAL_ORDER_CONTACT_AUTOMATION.md'
      - '.github/workflows/physical-order-contact-automation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-contact-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run vault, projection and queue regressions
        run: >-
          node --test
          services/physical-orders/contact-vault.test.mjs
          services/physical-orders/automation-bridge.test.mjs
          scripts/commerce-automation-runtime.test.mjs
      - name: Check server and automation module syntax
        run: |
          node --check services/physical-orders/server.mjs
          node --check services/physical-orders/contact-vault.mjs
          node --check services/physical-orders/automation-bridge.mjs
      - name: Verify physical automation remains fail-closed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const server = fs.readFileSync('services/physical-orders/server.mjs', 'utf8');
          const bridge = fs.readFileSync('services/physical-orders/automation-bridge.mjs', 'utf8');
          if (!server.includes("PHYSICAL_ORDER_AUTOMATION_ENABLED === 'true'")) throw new Error('physical automation enable gate missing');
          if (!server.includes('AUTOMATION_CONTACT_VAULT_KEY') || !server.includes('AUTOMATION_RECIPIENT_REF_KEY')) throw new Error('contact-vault keys missing');
          if (!server.includes('await ingest(event, ledger, catalog, live)')) throw new Error('existing order ingest no longer authoritative');
          if (!server.includes('ledger.snapshot()')) throw new Error('projection is not based on committed order state');
          for (const source of [server, bridge]) {
            for (const forbidden of ['resend.emails.send(', 'stripe.checkout.sessions.create(', '/order/createOrder', 'publishProduct(']) {
              if (source.includes(forbidden)) throw new Error(`forbidden irreversible action embedded: ${forbidden}`);
            }
          }
          console.log('Physical contact projection remains encrypted, queue-only and fail-closed.');
          NODE
