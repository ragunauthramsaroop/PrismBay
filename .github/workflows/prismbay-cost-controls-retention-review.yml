name: PrismBay Cost Controls retention review only
on:
  push:
    paths:
      - youtube-growth/production/build_cost_controls_retention_review.py
      - .github/workflows/prismbay-cost-controls-retention-review.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Retrieve verified original unpublished video
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fLsS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12866038124/zip" \
            -o source.zip
          mkdir -p review
          unzip -oq source.zip -d review
          echo "c8da6a5fa46bb1e7ea9dfd6abf82b55d44b80d7fc63fdf515db7362d58be6a72  review/ai-agent-cost-controls-draft.mp4" | sha256sum -c -
      - name: Validate corrected subtitle candidate
        run: python youtube-growth/qa/validate_cost_controls_caption_candidate.py
      - name: Render six original retention and source-context overlays
        run: |
          python youtube-growth/production/build_cost_controls_retention_review.py \
            --input review/ai-agent-cost-controls-draft.mp4 \
            --output review/ai-agent-cost-controls-retention-review.mp4 \
            --asset-dir review/retention-assets \
            --manifest review/retention-review-manifest.json
          cp youtube-growth/analytics/cost-controls-asr-qa/captions-asr-candidate.srt review/captions-review-only.srt
      - name: Independently verify unchanged audio and selected frame differences
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i review/ai-agent-cost-controls-draft.mp4 -map 0:a:0 -c copy -f adts review/source.aac
          ffmpeg -hide_banner -loglevel error -y -i review/ai-agent-cost-controls-retention-review.mp4 -map 0:a:0 -c copy -f adts review/revised.aac
          cmp review/source.aac review/revised.aac
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('review/retention-review-manifest.json').read_text())
          assert m['channelId']=='UCw2hs85TzIpdKwJtG-BSxzQ'
          assert m['publicationApproved'] is False and m['uploadPermitted'] is False
          assert len(m['cards'])==6
          assert abs(m['durationSeconds']-559.503)<0.25
          print('Review-only controls and source audio preservation PASS')
          PY
          rm -f review/source.aac review/revised.aac
      - name: Upload editorial review artifact, never publish
        uses: actions/upload-artifact@v4
        with:
          name: prismbay-cost-controls-retention-review-unpublished
          path: |
            review/ai-agent-cost-controls-retention-review.mp4
            review/captions-review-only.srt
            review/retention-review-manifest.json
            review/retention-assets/*.png
          retention-days: 7
