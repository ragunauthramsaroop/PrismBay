name: PrismBay P-A-C-E-R private Kokoro narration timing
on:
  push:
    paths:
      - 'youtube-growth/tools/pacer_kokoro_private_narration.py'
      - 'youtube-growth/production/2026-11-02-pacer-sentence-aligned-voiceover-cues.json'
      - '.github/workflows/prismbay-pacer-private-kokoro-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-private-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and publication locks without models
        run: python youtube-growth/tools/pacer_kokoro_private_narration.py --check
      - name: Install zero-cost offline voice engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.5,<1' 'soundfile>=0.12,<1' 'numpy>=1.26,<3'
      - name: Download public Apache-2.0 Kokoro model and voice vectors
        run: |
          mkdir -p /tmp/prismbay-kokoro
          curl -fLsS --retry 3 --retry-delay 3 -o /tmp/prismbay-kokoro/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 --retry-delay 3 -o /tmp/prismbay-kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s /tmp/prismbay-kokoro/kokoro-v1.0.fp16.onnx)" -gt 100000000
          test "$(stat -c%s /tmp/prismbay-kokoro/voices-v1.0.bin)" -gt 10000000
      - name: Synthesize each original scene and measure actual speech duration
        run: |
          python youtube-growth/tools/pacer_kokoro_private_narration.py --render --model /tmp/prismbay-kokoro/kokoro-v1.0.fp16.onnx --voices /tmp/prismbay-kokoro/voices-v1.0.bin --voice af_heart --speed 0.90 --out pacer-private-audio-review
      - name: Upload private review audio and measurements, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacer-private-kokoro-narration-review
          path: pacer-private-audio-review/
          retention-days: 7
          if-no-files-found: warn
      - name: Publication gate
        run: echo 'Private audio measurement only. No YouTube upload, Metricool changes, paid media, or final caption-sync claims.'
