name: PrismBay Lifecycle Journey CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lifecycle-journey-engine.mjs'
      - 'scripts/lifecycle-journey-engine.test.mjs'
      - 'docs/LIFECYCLE_JOURNEY_PROVENANCE.md'
      - '.github/workflows/lifecycle-journey-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lifecycle-journey-engine.mjs'
      - 'scripts/lifecycle-journey-engine.test.mjs'
      - 'docs/LIFECYCLE_JOURNEY_PROVENANCE.md'
      - '.github/workflows/lifecycle-journey-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run lifecycle regression tests
        run: node --test scripts/lifecycle-journey-engine.test.mjs
      - name: Verify empty dry run remains inert
        run: |
          tmp="$(mktemp -d)"
          node -e "import('./scripts/lifecycle-journey-engine.mjs').then(m=>m.main({reportDir:process.argv[1],nowMs:Date.parse('2026-10-04T12:00:00Z')}))" "$tmp"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1]+'/lifecycle-journey-dryrun.json'));if(r.liveSendAttempted||r.supplierOrderingAttempted)process.exit(1)" "$tmp"
