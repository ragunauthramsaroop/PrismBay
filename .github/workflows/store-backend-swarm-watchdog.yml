name: PrismBay Store Backend Swarm Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paperclip/prismbay-commerce-group/BACKEND_SWARM_24X7.md'
      - 'config/store-backend-swarm.json'
      - 'config/strict-kpis.json'
      - 'scripts/store-backend-swarm-watchdog.mjs'
      - 'scripts/store-backend-swarm-watchdog.test.mjs'
      - 'scripts/commerce-surface-auditor.mjs'
      - 'scripts/commerce-surface-auditor.test.mjs'
      - 'scripts/commerce-surface-remediation.mjs'
      - 'scripts/commerce-surface-remediation.test.mjs'
      - '.github/workflows/store-backend-swarm-watchdog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'paperclip/prismbay-commerce-group/BACKEND_SWARM_24X7.md'
      - 'config/store-backend-swarm.json'
      - 'config/strict-kpis.json'
      - 'scripts/store-backend-swarm-watchdog.mjs'
      - 'scripts/store-backend-swarm-watchdog.test.mjs'
      - 'scripts/commerce-surface-auditor.mjs'
      - 'scripts/commerce-surface-auditor.test.mjs'
      - 'scripts/commerce-surface-remediation.mjs'
      - 'scripts/commerce-surface-remediation.test.mjs'
      - '.github/workflows/store-backend-swarm-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: prismbay-store-backend-swarm-watchdog
  cancel-in-progress: true

jobs:
  verify-backend-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PrismBay
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test watchdog, commerce surfaces, remediation and strict KPI policy
        run: node --test scripts/store-backend-swarm-watchdog.test.mjs scripts/commerce-surface-auditor.test.mjs scripts/commerce-surface-remediation.test.mjs

      - name: Verify store health, swarm contract and KPI floors
        run: node scripts/store-backend-swarm-watchdog.mjs

      - name: Audit product, merchant, sitemap and robots commercial surfaces
        run: node scripts/commerce-surface-auditor.mjs

      - name: Convert surface defects into persistent repair work
        run: node scripts/commerce-surface-remediation.mjs

      - name: Retain backend swarm and commerce surface evidence
        uses: actions/upload-artifact@v4
        with:
          name: store-backend-swarm-${{ github.run_id }}
          path: |
            growth-reports/store-backend-swarm.json
            growth-reports/commerce-surface-audit.json
            growth-reports/commerce-surface-remediation.json
          if-no-files-found: error
          retention-days: 14

      - name: Backend swarm summary
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('growth-reports/store-backend-swarm.json','utf8'));
          const c=JSON.parse(fs.readFileSync('growth-reports/commerce-surface-audit.json','utf8'));
          const r=JSON.parse(fs.readFileSync('growth-reports/commerce-surface-remediation.json','utf8'));
          console.log('## PrismBay Clean | 24x7 Backend Swarm');
          console.log(`- Configured workers: ${s.configuredWorkerCount}`);
          console.log(`- Cadence: ${s.cadence}`);
          console.log(`- Public storefront checks passing: ${s.publicHealth.filter(x=>x.ok).length}/${s.publicHealth.length}`);
          console.log(`- KPI green threshold: ${s.kpiPolicy.greenAtOrAbove}/100`);
          console.log(`- KPI miss threshold: below ${s.kpiPolicy.redBelow}/100`);
          console.log(`- Intervention after consecutive misses: ${s.kpiPolicy.consecutiveRedBeforeIntervention}`);
          console.log(`- Role rewrite after consecutive misses: ${s.kpiPolicy.consecutiveRedBeforeRoleRewrite}`);
          console.log(`- Runtime authority: ${s.runtimeAuthority}`);
          console.log(`- Checked at: ${s.checkedAt}`);
          console.log('');
          console.log('## Commerce Surface Audit');
          console.log(`- Product feed products: ${c.products.productCount}; invalid: ${c.products.invalidProductCount}`);
          console.log(`- Merchant feed items: ${c.merchant.itemCount || 0}`);
          console.log(`- Sitemap URLs: ${c.sitemap.urlCount || 0}`);
          console.log(`- Technical surface ready: ${c.technicalSurfaceReady}`);
          console.log(`- Legacy storefront safe: ${c.legacyExposure?.safe ?? 'not checked'}`);
          console.log(`- Legacy direct checkout links: ${c.legacyExposure?.directCheckoutLinkCount ?? 'not checked'}`);
          console.log(`- Legacy unsupported in-stock feed rows: ${c.legacyExposure?.inStockFeedRowCount ?? 'not checked'}`);
          console.log(`- Open surface issues: ${c.issueCount}`);
          console.log(`- Persistent repair tasks: ${r.activeTaskCount}`);
          console.log(`- Highest-priority repair: ${r.nextAction}`);
          console.log(`- External free-distribution approval known: ${c.freeDistributionAccountApprovalKnown}`);
          console.log('- Missing evidence gets zero credit; activity alone is not success; integrity breach forces critical.');
          console.log('- Technical feed readiness is not platform approval and does not authorize publication or paid distribution.');
          NODE
