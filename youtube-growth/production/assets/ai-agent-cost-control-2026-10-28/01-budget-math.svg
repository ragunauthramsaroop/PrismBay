<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08182D"/><stop offset="1" stop-color="#122B41"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193C55"/><stop offset="1" stop-color="#10293E"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity=".3"/></filter></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1690" cy="60" r="350" fill="#1AD4CB" opacity=".045"/><circle cx="150" cy="1040" r="410" fill="#53A9F7" opacity=".045"/><rect x="90" y="74" width="60" height="60" rx="16" fill="#2BD3C8"/><text x="120" y="115" fill="#062036" font-size="42" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" text-anchor="middle">P</text><text x="171" y="115" fill="#E9F5FB" font-size="34" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold">PRISMBAY AI</text><text x="1830" y="114" text-anchor="end" fill="#7F9EAD" font-size="25" font-family="DejaVu Sans,Arial,sans-serif">AI SYSTEMS UNDER CONTROL</text><text x="95" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" fill="#FFFFFF" font-weight="bold" text-anchor="start">SAME WORKLOAD. FOUR TIMES THE BILL.</text><text x="95" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#9FC5D6" font-weight="normal" text-anchor="start">What changed? Paid calls per task.</text><rect x="95" y="368" width="805" height="460" rx="26" fill="url(#card)" stroke="#28516A" stroke-width="2"/><rect x="1020" y="368" width="805" height="460" rx="26" fill="url(#card)" stroke="#28516A" stroke-width="2"/><text x="150" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#9FC5D6" font-weight="bold" text-anchor="start">MONTH 1</text><text x="1075" y="433" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" fill="#9FC5D6" font-weight="bold" text-anchor="start">MONTH 2</text><text x="150" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="122" fill="#32DED0" font-weight="bold" text-anchor="start">$600</text><text x="1075" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="122" fill="#FFBC65" font-weight="bold" text-anchor="start">$2,400</text><text x="150" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#F1F8FB" font-weight="normal" text-anchor="start">6,000 tasks × 5 calls × $0.02</text><text x="1075" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#F1F8FB" font-weight="normal" text-anchor="start">6,000 tasks × 20 calls × $0.02</text><text x="150" y="737" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#A7C8D5" font-weight="normal" text-anchor="start">5 paid calls per task</text><text x="1075" y="737" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#A7C8D5" font-weight="normal" text-anchor="start">20 paid calls per task</text><rect x="908" y="540" width="104" height="88" rx="32" fill="#0A2133" stroke="#36D8CD" stroke-width="2"/><text x="960" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="52" fill="#32DED0" font-weight="bold" text-anchor="middle">4×</text><text x="95" y="916" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" fill="#B7D5E2" font-weight="bold" text-anchor="start">6,000 TASKS IN BOTH MONTHS</text><line x1="90" y1="984" x2="1830" y2="984" stroke="#28516A" stroke-width="2"/><text x="95" y="1030" fill="#8BAEBF" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">Illustrative example. Not a measured customer outcome.</text><text x="1830" y="1030" text-anchor="end" fill="#8BAEBF" font-size="24" font-family="DejaVu Sans,Arial,sans-serif">prismbayai.com</text></svg>