<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">PrismBay AI four-level agent permission matrix</title><desc id="desc">Original teaching framework: Observe, Draft, Propose, Execute, with separate system permissions and human gates.</desc>
<rect width="1920" height="1080" fill="#101A2B"/>
<text x="110" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-weight="bold" font-size="56" fill="#FFFFFF">WHO AUTHORIZES THE ACTION?</text>
<text x="110" y="175" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" fill="#A9BDD3">PrismBay AI original four-level teaching framework</text>
<g font-family="DejaVu Sans,Arial,sans-serif">
<rect x="100" y="250" width="1720" height="145" rx="20" fill="#1E354D"/><rect x="100" y="250" width="17" height="145" rx="8" fill="#49D8C4"/>
<text x="145" y="310" font-size="40" font-weight="bold" fill="#FFFFFF">01  OBSERVE</text><text x="700" y="310" font-size="31" fill="#DAF5F1">Read approved data</text><text x="700" y="360" font-size="24" fill="#A9BDD3">No edits, no outbound actions</text>
<rect x="100" y="415" width="1720" height="145" rx="20" fill="#1E354D"/><rect x="100" y="415" width="17" height="145" rx="8" fill="#75BDF0"/>
<text x="145" y="475" font-size="40" font-weight="bold" fill="#FFFFFF">02  DRAFT</text><text x="700" y="475" font-size="31" fill="#DAF5F1">Prepare a staged response</text><text x="700" y="525" font-size="24" fill="#A9BDD3">Human reviews before external release</text>
<rect x="100" y="580" width="1720" height="145" rx="20" fill="#1E354D"/><rect x="100" y="580" width="17" height="145" rx="8" fill="#F9B44A"/>
<text x="145" y="640" font-size="40" font-weight="bold" fill="#FFFFFF">03  PROPOSE</text><text x="700" y="640" font-size="31" fill="#FFEDCD">Submit a specific action</text><text x="700" y="690" font-size="24" fill="#A9BDD3">Independent, transaction-specific approval</text>
<rect x="100" y="745" width="1720" height="145" rx="20" fill="#462C3B"/><rect x="100" y="745" width="17" height="145" rx="8" fill="#FF6978"/>
<text x="145" y="805" font-size="40" font-weight="bold" fill="#FFFFFF">04  EXECUTE</text><text x="700" y="805" font-size="31" fill="#FFE0E3">Run an explicitly allowed action</text><text x="700" y="855" font-size="24" fill="#F1BEC5">Technical limits, logging, rollback</text>
<text x="110" y="980" font-size="29" fill="#FFFFFF">A text prompt is not an access-control boundary.</text>
<text x="1560" y="1025" font-size="23" fill="#7B95AC">PrismBay AI</text>
</g></svg>