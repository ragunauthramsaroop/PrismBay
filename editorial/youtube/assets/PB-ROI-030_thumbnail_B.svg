<text x="75" y="295" font-family="DejaVu Sans,sans-serif" font-size="70" font-weight="800" fill="#FFFFFF">AI PILOT</text>
<text x="75" y="379" font-family="DejaVu Sans,sans-serif" font-size="70" font-weight="800" fill="#7EE5CF">SCORECARD</text>
<text x="77" y="475" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#C6DCE2">THREE GATES BEFORE YOU SCALE</text>
