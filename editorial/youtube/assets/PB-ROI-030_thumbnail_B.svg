   <path d="M57 391 L66 401 L81 380" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="111" y="396" font-size="29" font-weight="800" fill="#173A43">CONTROL</text>
