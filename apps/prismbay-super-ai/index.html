<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrismBay Super AI</title><link rel="stylesheet" href="/style.css"><script defer src="/ui.js"></script></head><body><main><header><p class="eyebrow">PRISMBAY / INTELLIGENCE LAB</p><h1>Super AI</h1><p>One workspace. Multiple model providers. Transparent results.</p></header><section class="panel"><label>Session access token<input id="token" type="password" autocomplete="off"></label><button id="connect">Check providers</button><p id="status" role="status">Not connected</p><div class="controls"><label>Mode<select id="mode"><option value="auto">Automatic fallback</option><option value="council">AI Council</option><option value="single">Single provider</option></select></label><label>Specialist<select id="profile"><option value="general">General</option><option value="executive">Executive strategy</option><option value="research">Research analysis</option><option value="code">Software engineering</option><option value="writing">Writing</option></select></label><label>Provider<select id="provider"><option>groq</option><option>gemini</option><option>nvidia</option><option>openrouter</option><option>mistral</option></select></label></div></section><section class="panel"><div id="history" aria-live="polite"></div><label>Message<textarea id="prompt" rows="5" maxlength="16000" placeholder="Ask a question or describe a task"></textarea></label><label class="consent"><input id="consent" type="checkbox"> I authorize sending this conversation to selected external AI providers. Do not submit confidential information.</label><div class="actions"><button id="send">Generate response</button><button id="clear" class="secondary">Clear session</button><button id="export" class="secondary">Export transcript</button></div><p id="notice" role="status"></p><details><summary>Provider execution trace</summary><pre id="trace"></pre></details><details><summary>Council candidates</summary><pre id="candidates"></pre></details></section><footer>Free-tier availability is conditional. AI outputs require human verification. No web retrieval or external action execution.</footer></main></body></html>
